<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#070d12">
    <title>Trabajo - PW Hub</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/branding/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/branding/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/branding/favicon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="../assets/branding/favicon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --fondo: #070d12;
            --fondo-secundario: #0b1219;
            --panel: #0e171f;
            --panel-suave: #111c25;
            --borde: #253543;
            --texto: #f4f7fa;
            --texto-secundario: #9db0bf;
            --acento: #35c9f3;
            --acento-rgb: 53, 201, 243;
            --papel: #f6f8fa;
            --codigo: #0b1219;
        }

        html {
            min-height: 100%;
            background: var(--fondo);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% -10%, rgba(var(--acento-rgb), .08), transparent 30%),
                var(--fondo);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        a { font: inherit; }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--acento);
            outline-offset: 3px;
        }

        .barra-trabajo {
            position: sticky;
            top: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 72px;
            padding: 11px max(18px, calc((100vw - 1440px) / 2));
            border-bottom: 1px solid var(--borde);
            background: #091118;
        }

        .barra-identidad {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .barra-logo {
            flex: 0 0 auto;
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .barra-titulo { min-width: 0; }

        .barra-etiqueta {
            margin: 0 0 3px;
            color: var(--acento);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .barra-trabajo h1 {
            overflow: hidden;
            margin: 0;
            font-size: clamp(17px, 2.4vw, 22px);
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .barra-acciones {
            display: flex;
            flex: 0 0 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .barra-accion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-secundario);
            background: var(--panel);
            text-decoration: none;
            font-size: 10px;
            font-weight: 800;
        }

        .barra-accion:hover {
            color: white;
            border-color: var(--acento);
        }

        .barra-accion.primaria {
            color: var(--acento);
            border-color: rgba(var(--acento-rgb), .48);
            background: rgba(var(--acento-rgb), .06);
        }

        .barra-accion[hidden] { display: none !important; }

        .contenedor-trabajo {
            width: min(1440px, calc(100% - 24px));
            min-width: 0;
            margin: 14px auto 22px;
            container-name: pw-trabajo;
            container-type: inline-size;
        }

        .estado-pagina {
            display: grid;
            min-height: calc(100dvh - 112px);
            place-items: center;
            padding: 32px;
            border: 1px solid var(--borde);
            border-radius: 14px;
            color: var(--texto-secundario);
            background: var(--panel);
            text-align: center;
        }

        /* Proyecto completo */
        .proyecto-shell {
            container-name: pw-proyecto;
            container-type: inline-size;
            display: grid;
            grid-template-columns: minmax(240px, 305px) minmax(0, 1fr);
            height: calc(100dvh - 108px);
            min-height: 560px;
            overflow: hidden;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 15px;
            background: var(--panel);
            box-shadow: 0 18px 54px rgba(0, 0, 0, .24);
        }

        .proyecto-archivos {
            min-width: 0;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            border-right: 1px solid var(--borde);
            background: var(--panel);
        }

        .proyecto-cabecera {
            position: sticky;
            top: 0;
            z-index: 4;
            padding: 16px;
            border-bottom: 1px solid var(--borde);
            background: var(--panel);
        }

        .proyecto-cabecera-linea {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .proyecto-cabecera-linea span,
        .recurso-info > span {
            color: var(--acento);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .proyecto-cabecera-linea strong {
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .proyecto-cabecera h2 {
            margin: 9px 0 6px;
            color: var(--texto);
            font-size: 15px;
            line-height: 1.35;
        }

        .proyecto-cabecera p {
            margin: 0 0 8px;
            color: var(--texto-secundario);
            font-size: 9px;
            line-height: 1.55;
        }

        .proyecto-cabecera code {
            display: block;
            overflow: hidden;
            color: var(--texto-secundario);
            font-size: 8px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .proyecto-lista { padding: 11px; }

        .proyecto-grupo + .proyecto-grupo { margin-top: 15px; }

        .proyecto-grupo h3 {
            margin: 0 0 7px;
            padding: 0 4px;
            color: var(--texto-secundario);
            font-size: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .proyecto-grupo-lista {
            display: grid;
            gap: 6px;
        }

        .proyecto-archivo {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
            width: 100%;
            min-height: 52px;
            padding: 7px 8px;
            cursor: pointer;
            border: 1px solid var(--borde);
            border-radius: 9px;
            color: var(--texto);
            background: var(--fondo-secundario);
            text-align: left;
        }

        .proyecto-archivo:hover,
        .proyecto-archivo.activo {
            border-color: rgba(var(--acento-rgb), .7);
            background: rgba(var(--acento-rgb), .07);
        }

        .proyecto-archivo.activo {
            box-shadow: inset 3px 0 0 var(--acento);
        }

        .archivo-extension {
            display: inline-grid;
            place-items: center;
            min-height: 27px;
            padding: 0 5px;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 6px;
            color: var(--acento);
            font-size: 8px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .archivo-texto { min-width: 0; }

        .archivo-texto strong,
        .archivo-texto small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .archivo-texto strong { font-size: 10px; }
        .archivo-texto small {
            margin-top: 3px;
            color: var(--texto-secundario);
            font-size: 8px;
        }

        .proyecto-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--panel);
        }

        .recurso-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-width: 0;
            min-height: 72px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--borde);
            background: var(--panel);
        }

        .recurso-info {
            flex: 1 1 280px;
            min-width: 0;
        }

        .recurso-info strong,
        .recurso-info code {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .recurso-info strong {
            margin-top: 2px;
            font-size: 12px;
        }

        .recurso-info code {
            margin-top: 3px;
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .recurso-modos {
            display: flex;
            flex: 0 1 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 6px;
            min-width: 0;
        }

        .recurso-modo {
            min-height: 34px;
            padding: 6px 10px;
            cursor: pointer;
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-secundario);
            background: var(--fondo-secundario);
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .recurso-modo:hover,
        .recurso-modo.activo {
            color: var(--texto);
            border-color: rgba(var(--acento-rgb), .72);
        }

        .recurso-modo.activo {
            color: var(--acento);
            background: rgba(var(--acento-rgb), .09);
        }

        .superficie {
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            background: var(--panel);
        }

        .superficie.iframe { overflow: hidden; scrollbar-gutter: auto; }

        .frame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            background: white;
        }

        .estado-recurso {
            display: grid;
            min-height: 100%;
            place-items: center;
            align-content: center;
            gap: 8px;
            padding: 30px;
            color: var(--texto-secundario);
            text-align: center;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--borde);
            border-top-color: var(--acento);
            border-radius: 50%;
            animation: giro .8s linear infinite;
        }

        @keyframes giro { to { transform: rotate(360deg); } }

        .codigo {
            width: max-content;
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 22px;
            color: #dce8ef;
            background: var(--codigo);
            white-space: pre;
            tab-size: 4;
            font-family: Consolas, "Cascadia Code", "Courier New", monospace;
            font-size: 12px;
            line-height: 1.65;
        }

        .imagen-visor {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--papel);
        }

        .imagen-escenario {
            position: absolute;
            inset: 0;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            background:
                linear-gradient(rgba(35, 55, 70, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(35, 55, 70, .055) 1px, transparent 1px),
                var(--papel);
            background-size: 20px 20px;
        }

        .imagen-escenario.arrastrando {
            cursor: grabbing;
        }

        .imagen-zoomable {
            position: absolute;
            left: 50%;
            top: 50%;
            display: block;
            max-width: none;
            max-height: none;
            transform: translate(-50%, -50%);
            user-select: none;
            -webkit-user-drag: none;
        }

        .imagen-controles {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 12;
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid rgba(25, 45, 60, .25);
            border-radius: 9px;
            background: rgba(10, 18, 24, .94);
        }

        .imagen-controles button {
            min-width: 34px;
            height: 32px;
            padding: 0 9px;
            cursor: pointer;
            border: 1px solid rgba(157, 176, 191, .28);
            border-radius: 6px;
            color: #dce8ef;
            background: #111c25;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .imagen-controles button:hover,
        .imagen-controles button.activo {
            color: white;
            border-color: rgba(var(--acento-rgb), .72);
        }

        .imagen-visor:fullscreen,
        .imagen-visor.fullscreen-fallback {
            width: 100vw;
            height: 100vh;
            background: var(--papel);
        }

        .imagen-visor.fullscreen-fallback {
            position: fixed;
            inset: 0;
            z-index: 100000;
        }

        .markdown {
            min-height: 100%;
            padding: 28px clamp(22px, 5vw, 58px) 42px;
            color: #dce8ef;
            background: var(--fondo-secundario);
            line-height: 1.75;
        }

        .markdown > * { max-width: 920px; margin-left: auto; margin-right: auto; }
        .markdown img { max-width: 100%; height: auto; }
        .markdown a { color: var(--acento); }
        .markdown pre { overflow-x: auto; padding: 16px; border-radius: 9px; background: #070c11; }
        .markdown code { font-family: Consolas, "Cascadia Code", monospace; }
        .markdown table { width: 100%; border-collapse: collapse; }
        .markdown th, .markdown td { padding: 9px 11px; border: 1px solid var(--borde); text-align: left; }

        /* Draw.io */
        .drawio {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            background: var(--panel);
        }

        .drawio-aviso {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--borde);
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .drawio-aviso span {
            flex: 0 0 auto;
            padding: 4px 7px;
            border: 1px solid rgba(var(--acento-rgb), .42);
            border-radius: 20px;
            color: var(--acento);
            font-weight: 800;
            white-space: nowrap;
        }

        .drawio-aviso p { margin: 0; }

        .drawio-render {
            position: relative;
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            background:
                linear-gradient(rgba(35, 55, 70, .07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(35, 55, 70, .07) 1px, transparent 1px),
                #f5f6f8;
            background-size: 20px 20px;
        }

        .drawio-render.arrastrando { cursor: grabbing; }
        .drawio-escenario { position: absolute; inset: 0; overflow: hidden; }

        .drawio-graph {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            max-width: none;
            max-height: none;
            overflow: hidden;
            background: #fff;
            transform: none !important;
        }

        .drawio-controles {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 12;
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid rgba(25, 45, 60, .25);
            border-radius: 9px;
            background: rgba(10, 18, 24, .94);
        }

        .drawio-controles button {
            min-width: 34px;
            height: 32px;
            padding: 0 9px;
            cursor: pointer;
            border: 1px solid rgba(157, 176, 191, .28);
            border-radius: 6px;
            color: #dce8ef;
            background: #111c25;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .drawio-controles button:hover,
        .drawio-controles button.activo {
            color: white;
            border-color: rgba(var(--acento-rgb), .72);
        }

        .drawio-render:fullscreen,
        .drawio-render.fullscreen-fallback {
            width: 100vw;
            height: 100vh;
        }

        .drawio-render.fullscreen-fallback {
            position: fixed;
            inset: 0;
            z-index: 100000;
        }

        /* Archivo individual fuera de proyecto */
        .visor-simple {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-height: calc(100dvh - 108px);
            overflow: hidden;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 15px;
            background: var(--panel);
        }

        /*
           El shell no puede consultarse a si mismo. La consulta usa el
           contenedor padre para decidir cuando las dos columnas ya no caben.
        */
        @container pw-trabajo (max-width: 760px) {
            .proyecto-shell {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(150px, 31vh) minmax(0, 1fr);
            }

            .proyecto-archivos {
                border-right: 0;
                border-bottom: 1px solid var(--borde);
            }
        }

        @container pw-proyecto (max-width: 620px) {
            .recurso-toolbar {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                align-items: start;
                align-content: start;
                gap: 8px;
            }

            .recurso-info {
                width: 100%;
                min-width: 0;
                min-height: 0;
                flex: none;
            }

            .recurso-modos {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
                width: 100%;
                min-width: 0;
                justify-content: stretch;
            }

            .recurso-modo {
                width: 100%;
                min-width: 0;
                min-height: 34px;
                height: auto;
                flex: none;
            }
        }

        @media (max-width: 720px) {
            .barra-trabajo {
                align-items: flex-start;
                padding: 10px 12px;
            }

            .barra-logo { width: 38px; height: 38px; }
            .barra-acciones { gap: 6px; }
            .barra-accion { min-height: 34px; padding: 7px 9px; font-size: 9px; }
            .barra-accion.secundaria { display: none; }

            .contenedor-trabajo {
                width: calc(100% - 12px);
                margin: 6px auto 12px;
            }

            .proyecto-shell {
                height: calc(100dvh - 88px);
                min-height: 500px;
                border-radius: 11px;
            }

            .proyecto-cabecera { padding: 11px 12px; }
            .proyecto-lista { padding: 8px; }
            .proyecto-grupo-lista { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .proyecto-archivo { min-height: 48px; grid-template-columns: 48px minmax(0, 1fr); }
            .codigo { padding: 16px; font-size: 10px; }
            .imagen-controles { top: 7px; left: 7px; }
        }

        @media (max-width: 430px) {
            .barra-trabajo h1 { font-size: 16px; }
            .proyecto-grupo-lista { grid-template-columns: 1fr; }
            .drawio-controles,
            .imagen-controles { top: 7px; left: 7px; }

            .drawio-controles button,
            .imagen-controles button { min-width: 31px; height: 30px; padding-inline: 7px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <header class="barra-trabajo">
        <div class="barra-identidad">
            <img src="../assets/branding/isotipo-pwhub.png" alt="" class="barra-logo" aria-hidden="true">
            <div class="barra-titulo">
                <p class="barra-etiqueta" id="tipo-trabajo">Trabajo</p>
                <h1 id="titulo-trabajo">Cargando trabajo...</h1>

        <div class="barra-acciones">

            </a>
            <a href="../index.html" class="barra-accion secundaria" id="volver-hub">Volver al Hub</a>
        </div>
    </header>

    <main class="contenedor-trabajo" id="contenedor-trabajo">
        <div class="estado-pagina">Cargando trabajo...</div>
    </main>

    <script>
        (() => {
            "use strict";

            const VERSION = "1.2.2-c2";

            const FALLBACKS = {
