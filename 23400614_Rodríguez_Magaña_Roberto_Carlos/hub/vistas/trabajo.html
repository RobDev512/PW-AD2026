                ]
            };

            const GRUPOS = ["Página", "Código", "Diseño", "Imágenes", "Documentos", "Otros"];
            const cacheFuente = new Map();
            let promesaVisorDrawio = null;
            let tokenRender = 0;

            let rutaTrabajo = "";
            let tipoTrabajo = "";
            let tituloTrabajo = "";
            let infoProyecto = null;
            let recursosProyecto = [];
            let recursoActual = null;
            let modoActual = "diseno";
            let trabajoCatalogo = null;

            document.addEventListener("DOMContentLoaded", iniciar);

            async function iniciar() {
                configurarVolverHub();

                const parametros = new URLSearchParams(window.location.search);
                rutaTrabajo = parametros.get("archivo") || "";
                tipoTrabajo = normalizarTipo(parametros.get("tipo") || obtenerTipoDesdeRuta(rutaTrabajo));
                tituloTrabajo = parametros.get("titulo") || "Trabajo";

                if (!rutaTrabajo) {
                    mostrarEstadoPagina("No se indicó un archivo para mostrar.");
                    return;
                }

                infoProyecto = detectarProyecto(rutaTrabajo);

                if (infoProyecto) {
                    await iniciarProyecto();
                } else {
                    iniciarArchivoIndividual();
                }
            }

            function configurarVolverHub() {
                const volver = document.getElementById("volver-hub");
                volver?.addEventListener("click", (evento) => {
                    try {
                        const referencia = document.referrer ? new URL(document.referrer) : null;
                        const mismaAplicacion = referencia &&
                            referencia.origin === window.location.origin &&
                            referencia.pathname.includes("/hub/");

                        if (mismaAplicacion && window.history.length > 1) {
                            evento.preventDefault();
                            window.history.back();
                        }
                    } catch {
                        // El enlace normal sigue siendo el fallback.
                    }
                });
            }

            async function iniciarProyecto() {
                mostrarEstadoPagina("Explorando archivos del proyecto...");

                trabajoCatalogo = await obtenerTrabajoCatalogo(infoProyecto).catch(() => null);
                const nombreProyecto = trabajoCatalogo?.nombre || limpiarNombreCarpeta(infoProyecto.carpeta);
                const descripcion = trabajoCatalogo?.descripcion || "Proyecto académico organizado por carpeta.";

                infoProyecto.principal = normalizarRutaRelativa(trabajoCatalogo?.ruta || infoProyecto.rutaAlumno);

                document.getElementById("tipo-trabajo").textContent =
                    `U${infoProyecto.unidad} · Proyecto por carpeta`;
                document.getElementById("titulo-trabajo").textContent = nombreProyecto;
                document.title = `${nombreProyecto} - PW Hub`;

                recursosProyecto = await obtenerRecursosProyecto(infoProyecto);

                recursoActual = recursosProyecto.find((recurso) =>
                    recurso.rutaAlumno === infoProyecto.rutaAlumno
                ) || recursosProyecto.find((recurso) =>
                    recurso.rutaAlumno === infoProyecto.principal
                ) || recursosProyecto[0] || crearRecurso(infoProyecto.rutaAlumno, infoProyecto);

                construirWorkspaceProyecto(nombreProyecto, descripcion);
                seleccionarRecurso(recursoActual);
            }

            function iniciarArchivoIndividual() {
                document.getElementById("tipo-trabajo").textContent = formatearTipo(tipoTrabajo);
                document.getElementById("titulo-trabajo").textContent = tituloTrabajo;
                document.title = `${tituloTrabajo} - PW Hub`;

                const recurso = {
                    nombre: tituloTrabajo,
                    ruta: new URL(rutaTrabajo, window.location.href).href,
                    rutaAlumno: "",
                    relativa: tituloTrabajo,
                    tipo: tipoTrabajo,
                    categoria: "Trabajo"
                };

                document.getElementById("contenedor-trabajo").innerHTML = `
                    <section class="visor-simple proyecto-panel">
                        <header class="recurso-toolbar">
                            <div class="recurso-info">
                                <span>Archivo</span>
                                <strong id="recurso-nombre"></strong>
                                <code id="recurso-ruta"></code>
                            </div>
                            <div class="recurso-modos" id="recurso-modos"></div>
                        </header>
                        <div class="superficie" id="superficie"></div>
                    </section>
                `;

                recursoActual = recurso;
                seleccionarRecurso(recurso);
            }

            async function obtenerTrabajoCatalogo(info) {
                const respuesta = await fetch("../data/unidades.json", { cache: "no-cache" });
                if (!respuesta.ok) return null;
                const datos = await respuesta.json();
                const trabajos = (datos?.unidades || []).flatMap((unidad) => unidad?.trabajos || []);
                return trabajos.find((trabajo) => {
                    const ruta = normalizarRutaRelativa(trabajo?.ruta || "");
                    return ruta.startsWith(info.raiz);
                }) || null;
            }

            async function obtenerRecursosProyecto(info) {
                try {
                    const url = `https://api.github.com/repos/${REPOSITORIO}/git/trees/${encodeURIComponent(RAMA)}?recursive=1`;
                    const respuesta = await fetch(url, {
                        headers: { Accept: "application/vnd.github+json" },
                        cache: "no-store"
                    });

                    if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);
                    const datos = await respuesta.json();
                    const prefijo = `${RAIZ_ALUMNO}/${info.raiz}`;
                    const recursos = (datos.tree || [])
                        .filter((elemento) =>
                            elemento?.type === "blob" &&
                            typeof elemento.path === "string" &&
                            elemento.path.startsWith(prefijo)
                        )
                        .map((elemento) =>
                            crearRecurso(elemento.path.slice(RAIZ_ALUMNO.length + 1), info)
                        );

                    if (recursos.length) {
                        return recursos.sort((a, b) => compararRecursos(a, b, info.principal));
                    }
                } catch (error) {
                    console.warn("PW Hub: se usará el inventario local del proyecto.", error);
                }

                const rutas = FALLBACKS[info.raiz] || [info.rutaAlumno.slice(info.raiz.length)];
                const recursos = rutas.map((ruta) => crearRecurso(`${info.raiz}${ruta}`, info));

                if (!recursos.some((recurso) => recurso.rutaAlumno === info.rutaAlumno)) {
                    recursos.unshift(crearRecurso(info.rutaAlumno, info));
                }

                return recursos.sort((a, b) => compararRecursos(a, b, info.principal));
            }

            function crearRecurso(rutaAlumno, info) {
                const rutaNormalizada = normalizarRutaRelativa(rutaAlumno);
                const relativa = rutaNormalizada.startsWith(info.raiz)
                    ? rutaNormalizada.slice(info.raiz.length)
                    : rutaNormalizada;
                const nombre = relativa.split("/").pop() || relativa;
                const tipo = obtenerTipoDesdeRuta(rutaNormalizada);

                return {
                    ruta: new URL(`../../${rutaNormalizada}`, window.location.href).href,
                    rutaAlumno: rutaNormalizada,
                    relativa,
                    nombre,
                    tipo,
                    categoria: obtenerCategoriaRecurso(relativa, tipo)
                };
            }

            function construirWorkspaceProyecto(nombre, descripcion) {
                const grupos = agruparRecursos(recursosProyecto);

                document.getElementById("contenedor-trabajo").innerHTML = `
                    <section class="proyecto-shell">
                        <aside class="proyecto-archivos" aria-label="Archivos del proyecto">
                            <header class="proyecto-cabecera">
                                <div class="proyecto-cabecera-linea">
                                    <span>Proyecto completo</span>
                                    <strong>${recursosProyecto.length} ${recursosProyecto.length === 1 ? "archivo" : "archivos"}</strong>
                                </div>
                                <h2>${escaparHtml(nombre)}</h2>
                                <p>${escaparHtml(descripcion)}</p>
                                <code>${escaparHtml(infoProyecto.raiz)}</code>
                            </header>
                            <div class="proyecto-lista">
                                ${grupos.map(renderizarGrupo).join("")}
                            </div>
                        </aside>

                        <section class="proyecto-panel">
                            <header class="recurso-toolbar">
                                <div class="recurso-info">
                                    <span id="recurso-categoria">Archivo</span>
                                    <strong id="recurso-nombre">Selecciona un recurso</strong>
                                    <code id="recurso-ruta"></code>
                                </div>
                                <div class="recurso-modos" id="recurso-modos" role="group" aria-label="Modo de visualización"></div>
                            </header>
                            <div class="superficie" id="superficie"></div>
                        </section>
                    </section>
                `;

                document.querySelectorAll("[data-recurso]").forEach((boton) => {
                    boton.addEventListener("click", () => {
                        const recurso = recursosProyecto[Number(boton.dataset.recurso)];
                        if (recurso) seleccionarRecurso(recurso);
                    });
                });
            }

            function agruparRecursos(recursos) {
                return GRUPOS.map((categoria) => ({
                    categoria,
                    recursos: recursos
                        .map((recurso, indice) => ({ ...recurso, indice }))
                        .filter((recurso) => recurso.categoria === categoria)
                })).filter((grupo) => grupo.recursos.length > 0);
            }

            function renderizarGrupo(grupo) {
                return `
                    <section class="proyecto-grupo">
                        <h3>${escaparHtml(grupo.categoria)}</h3>
                        <div class="proyecto-grupo-lista">
                            ${grupo.recursos.map((recurso) => `
                                <button type="button" class="proyecto-archivo" data-recurso="${recurso.indice}" title="${escaparHtml(recurso.relativa)}">
                                    <span class="archivo-extension">${escaparHtml(etiquetaTipo(recurso.tipo))}</span>
                                    <span class="archivo-texto">
                                        <strong>${escaparHtml(recurso.nombre)}</strong>
                                        <small>${escaparHtml(recurso.relativa)}</small>
                                    </span>
                                </button>
                            `).join("")}
                        </div>
                    </section>
                `;
            }

            function seleccionarRecurso(recurso) {
                recursoActual = recurso;
                tokenRender += 1;
                fuenteActualReset();

                document.querySelectorAll("[data-recurso]").forEach((boton) => {
                    const candidato = recursosProyecto[Number(boton.dataset.recurso)];
                    boton.classList.toggle("activo", candidato?.rutaAlumno === recurso.rutaAlumno);
                });

                const nombre = document.getElementById("recurso-nombre");
                const ruta = document.getElementById("recurso-ruta");
                const categoria = document.getElementById("recurso-categoria");

                if (nombre) nombre.textContent = recurso.nombre;
                if (ruta) ruta.textContent = recurso.relativa || recurso.ruta;
                if (categoria) categoria.textContent = recurso.categoria || formatearTipo(recurso.tipo);

                const abrir = document.getElementById("abrir-original");
                abrir.href = recurso.ruta;
                abrir.hidden = false;

                const modos = obtenerModosRecurso(recurso);
                modoActual = modos[0]?.id || "codigo";
                construirBotonesModo(modos);
                renderizarRecurso(recurso, modoActual, tokenRender);
            }

            function construirBotonesModo(modos) {
                const contenedor = document.getElementById("recurso-modos");
                if (!contenedor) return;

                contenedor.innerHTML = modos.map((modo) => `
                    <button type="button" class="recurso-modo ${modo.id === modoActual ? "activo" : ""}" data-modo="${modo.id}">
                        ${escaparHtml(modo.etiqueta)}
                    </button>
                `).join("");

                contenedor.querySelectorAll("[data-modo]").forEach((boton) => {
                    boton.addEventListener("click", () => {
                        modoActual = boton.dataset.modo;
                        contenedor.querySelectorAll(".recurso-modo").forEach((elemento) =>
                            elemento.classList.toggle("activo", elemento === boton)
                        );
                        tokenRender += 1;
                        renderizarRecurso(recursoActual, modoActual, tokenRender);
                    });
                });
            }

            function obtenerModosRecurso(recurso) {
                if (recurso.tipo === "html") {
                    return [
                        { id: "diseno", etiqueta: "Diseño" },
                        { id: "codigo", etiqueta: "Código HTML" }
                    ];
                }

                if (recurso.tipo === "markdown") {
                    return [
                        { id: "diseno", etiqueta: "Vista" },
                        { id: "codigo", etiqueta: "Markdown" }
                    ];
                }

                if (recurso.tipo === "drawio") {
                    const modos = [{ id: "diagrama", etiqueta: "Diagrama" }];
                    if (encontrarVisualDrawio(recurso)) modos.push({ id: "png", etiqueta: "PNG" });
                    modos.push({ id: "codigo", etiqueta: "XML" });
                    return modos;
                }

                if (recurso.tipo === "pdf" || esImagen(recurso.tipo)) {
                    return [{ id: "diseno", etiqueta: "Vista" }];
                }

                return [{ id: "codigo", etiqueta: etiquetaTipo(recurso.tipo) }];
            }

            async function renderizarRecurso(recurso, modo, token) {
                const superficie = document.getElementById("superficie");
                if (!superficie || !recurso) return;

                superficie.classList.remove("iframe");
                superficie.innerHTML = `
                    <div class="estado-recurso">
                        <span class="spinner" aria-hidden="true"></span>
                        <span>Cargando ${escaparHtml(recurso.nombre)}...</span>
                    </div>
                `;

                try {
                    if (recurso.tipo === "html" || recurso.tipo === "pdf") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else {
                            renderizarIframe(recurso, superficie);
                        }
                    } else if (recurso.tipo === "markdown") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else {
                            await renderizarMarkdown(recurso, superficie, token);
                        }
                    } else if (esImagen(recurso.tipo)) {
                        renderizarImagen(recurso, superficie);
                    } else if (recurso.tipo === "drawio") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else if (modo === "png") {
                            const visual = encontrarVisualDrawio(recurso);
                            if (!visual) throw new Error("No existe una exportación visual asociada.");
                            renderizarImagen(visual, superficie);
                        } else {
                            await renderizarDrawio(recurso, superficie, token);
                        }
                    } else {
                        await renderizarCodigo(recurso, superficie, token);
                    }
                } catch (error) {
                    console.error(error);
                    if (token !== tokenRender) return;
                    superficie.innerHTML = `
                        <div class="estado-recurso">
                            <strong>No fue posible mostrar este archivo.</strong>
                            <span>${escaparHtml(recurso.relativa || recurso.nombre)}</span>
                        </div>
                    `;
                }
            }

            function renderizarIframe(recurso, superficie) {
                superficie.classList.add("iframe");
                superficie.innerHTML = `<iframe src="${recurso.ruta}" class="frame" title="${escaparHtml(recurso.nombre)}"></iframe>`;
            }

            function renderizarImagen(recurso, superficie) {
                superficie.innerHTML = "";

                const visor = document.createElement("div");
                visor.className = "imagen-visor";
                visor.tabIndex = 0;
                visor.setAttribute(
                    "aria-label",
                    `Visor ampliable de ${recurso.nombre}`
                );

                const controles = document.createElement("div");
                controles.className = "imagen-controles";
                controles.setAttribute("role", "group");
                controles.setAttribute("aria-label", "Controles de la imagen");
                controles.innerHTML = `
                    <button type="button" data-imagen-zoom="menos" title="Alejar" aria-label="Alejar">−</button>
                    <button type="button" data-imagen-zoom="mas" title="Acercar" aria-label="Acercar">+</button>
                    <button type="button" data-imagen-ajustar>Ajustar</button>
                    <button type="button" data-imagen-pantalla title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
                `;

                const escenario = document.createElement("div");
                escenario.className = "imagen-escenario";

                const imagen = document.createElement("img");
                imagen.className = "imagen-zoomable";
                imagen.src = recurso.ruta;
                imagen.alt = recurso.nombre;
                imagen.draggable = false;

                escenario.appendChild(imagen);
                visor.append(controles, escenario);
                superficie.appendChild(visor);

                const iniciar = () => {
                    if (!visor.isConnected) return;
                    configurarVisorImagen(visor, escenario, imagen);
                };

                if (imagen.complete && imagen.naturalWidth > 0) iniciar();
                else imagen.addEventListener("load", iniciar, { once: true });
            }

            function configurarVisorImagen(visor, escenario, imagen) {
                const estado = {
                    escala: 1,
                    x: 0,
                    y: 0,
                    arrastrando: false,
                    puntero: null,
                    punteros: new Map(),
                    gestoPinza: null,
                    inicioX: 0,
                    inicioY: 0,
                    baseX: 0,
                    baseY: 0,
                    autoAjuste: true,
                    pantallaPendiente: false,
                    ajusteProgramado: null
                };

                const anchoNatural = Math.max(1, imagen.naturalWidth || 1);
                const altoNatural = Math.max(1, imagen.naturalHeight || 1);

                const aplicar = () => {
                    imagen.style.width = `${Math.max(1, anchoNatural * estado.escala)}px`;
                    imagen.style.height = "auto";
                    imagen.style.left = `calc(50% + ${estado.x}px)`;
                    imagen.style.top = `calc(50% + ${estado.y}px)`;
                };

                const calcularAjuste = () => {
                    const margen = 40;
                    const disponibleX = Math.max(1, escenario.clientWidth - margen);
                    const disponibleY = Math.max(1, escenario.clientHeight - margen);
                    return Math.min(
                        disponibleX / anchoNatural,
                        disponibleY / altoNatural,
                        1
                    );
                };

                const limitarEscala = (escala) => {
                    const minimo = Math.max(0.03, calcularAjuste() * 0.45);
                    return Math.min(6, Math.max(minimo, escala));
                };

                const ajustar = () => {
                    if (!visor.isConnected) return;
                    estado.escala = Math.max(0.03, calcularAjuste());
                    estado.x = 0;
                    estado.y = 0;
                    estado.autoAjuste = true;
                    estado.gestoPinza = null;
                    aplicar();
                };

                const programarAjuste = () => {
                    if (estado.ajusteProgramado) {
                        cancelAnimationFrame(estado.ajusteProgramado);
                    }
                    estado.ajusteProgramado = requestAnimationFrame(() => {
                        estado.ajusteProgramado = requestAnimationFrame(() => {
                            estado.ajusteProgramado = null;
                            ajustar();
                        });
                    });
                };

                const cambiarZoom = (direccion) => {
                    const factor = direccion > 0 ? 1.22 : 1 / 1.22;
                    const nueva = limitarEscala(estado.escala * factor);
                    if (Math.abs(nueva - estado.escala) < 0.0001) return;
                    estado.escala = nueva;
                    estado.autoAjuste = false;
                    aplicar();
                };

                const obtenerDosPunteros = () =>
                    Array.from(estado.punteros.values()).slice(0, 2);

                const medirPinza = () => {
                    const [a, b] = obtenerDosPunteros();
                    if (!a || !b) return null;
                    return {
                        distancia: Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)),
                        centroX: (a.x + b.x) / 2,
                        centroY: (a.y + b.y) / 2
                    };
                };

                const iniciarPinza = () => {
                    const medida = medirPinza();
                    if (!medida) return;

                    const rect = escenario.getBoundingClientRect();
                    const centroLocalX = medida.centroX - rect.left;
                    const centroLocalY = medida.centroY - rect.top;

                    estado.gestoPinza = {
                        distancia: medida.distancia,
                        escala: estado.escala,
                        centroX: centroLocalX,
                        centroY: centroLocalY,
                        imagenX: escenario.clientWidth / 2 + estado.x,
                        imagenY: escenario.clientHeight / 2 + estado.y
                    };
                    estado.arrastrando = false;
                    estado.puntero = null;
                    estado.autoAjuste = false;
                    escenario.classList.remove("arrastrando");
                };

                const actualizarPinza = () => {
                    const medida = medirPinza();
                    const base = estado.gestoPinza;
                    if (!medida || !base) return;

                    const rect = escenario.getBoundingClientRect();
                    const centroX = medida.centroX - rect.left;
                    const centroY = medida.centroY - rect.top;
                    const nuevaEscala = limitarEscala(
                        base.escala * (medida.distancia / base.distancia)
                    );
                    const relacion = nuevaEscala / base.escala;

                    const imagenX =
                        centroX - (base.centroX - base.imagenX) * relacion;
                    const imagenY =
                        centroY - (base.centroY - base.imagenY) * relacion;

                    estado.escala = nuevaEscala;
                    estado.x = imagenX - escenario.clientWidth / 2;
                    estado.y = imagenY - escenario.clientHeight / 2;
                    estado.autoAjuste = false;
                    aplicar();
                };

                const iniciarArrastreCon = (puntero) => {
                    if (!puntero) return;
                    estado.arrastrando = true;
                    estado.puntero = puntero.id;
                    estado.inicioX = puntero.x;
                    estado.inicioY = puntero.y;
                    estado.baseX = estado.x;
                    estado.baseY = estado.y;
                    estado.autoAjuste = false;
                    escenario.classList.add("arrastrando");
                };

                visor
                    .querySelector('[data-imagen-zoom="menos"]')
                    ?.addEventListener("click", () => cambiarZoom(-1));
                visor
                    .querySelector('[data-imagen-zoom="mas"]')
                    ?.addEventListener("click", () => cambiarZoom(1));
                visor
                    .querySelector("[data-imagen-ajustar]")
                    ?.addEventListener("click", programarAjuste);

                const botonPantalla = visor.querySelector("[data-imagen-pantalla]");

                botonPantalla?.addEventListener("click", async () => {
                    if (estado.pantallaPendiente) return;
                    estado.pantallaPendiente = true;
                    botonPantalla.disabled = true;

                    try {
                        if (document.fullscreenElement === visor) {
                            await document.exitFullscreen();
                        } else if (typeof visor.requestFullscreen === "function") {
                            await visor.requestFullscreen();
                        } else {
                            visor.classList.toggle("fullscreen-fallback");
                            programarAjuste();
                        }
                    } catch (error) {
                        console.warn(
                            "PW Hub: no fue posible cambiar el modo de pantalla completa de la imagen.",
                            error
                        );
                    } finally {
                        estado.pantallaPendiente = false;
                        botonPantalla.disabled = false;
                    }
                });

                escenario.addEventListener("pointerdown", (evento) => {
                    if (evento.pointerType !== "touch" && evento.button !== 0) return;

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });
                    escenario.setPointerCapture?.(evento.pointerId);

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                    } else {
                        iniciarArrastreCon(estado.punteros.get(evento.pointerId));
                    }

                    evento.preventDefault();
                });

                escenario.addEventListener("pointermove", (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });

                    if (estado.punteros.size >= 2) {
                        if (!estado.gestoPinza) iniciarPinza();
                        actualizarPinza();
                        evento.preventDefault();
                        return;
                    }

                    if (
                        estado.arrastrando &&
                        evento.pointerId === estado.puntero
                    ) {
                        estado.x = estado.baseX + (evento.clientX - estado.inicioX);
                        estado.y = estado.baseY + (evento.clientY - estado.inicioY);
                        aplicar();
                        evento.preventDefault();
                    }
                });

                const terminarPuntero = (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    estado.punteros.delete(evento.pointerId);
                    try {
                        escenario.releasePointerCapture?.(evento.pointerId);
                    } catch {
                        // El navegador puede liberar la captura automáticamente.
                    }

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                        return;
                    }

                    estado.gestoPinza = null;

                    if (estado.punteros.size === 1) {
                        iniciarArrastreCon(Array.from(estado.punteros.values())[0]);
                        return;
                    }

                    estado.arrastrando = false;
                    estado.puntero = null;
                    escenario.classList.remove("arrastrando");
                };

                escenario.addEventListener("pointerup", terminarPuntero);
                escenario.addEventListener("pointercancel", terminarPuntero);

                visor.addEventListener(
                    "wheel",
                    (evento) => {
                        if (!evento.ctrlKey) return;
                        evento.preventDefault();
                        cambiarZoom(evento.deltaY < 0 ? 1 : -1);
                    },
                    { passive: false }
                );

                escenario.addEventListener("dblclick", (evento) => {
                    evento.preventDefault();
                    cambiarZoom(1);
                });

                let observador = null;

                const alCambiarPantalla = () => {
                    if (!visor.isConnected) {
                        document.removeEventListener(
                            "fullscreenchange",
                            alCambiarPantalla
                        );
                        observador?.disconnect();
                        return;
                    }

                    const activo =
                        document.fullscreenElement === visor ||
                        visor.classList.contains("fullscreen-fallback");

                    botonPantalla?.classList.toggle("activo", activo);
                    botonPantalla?.setAttribute(
                        "aria-label",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    botonPantalla?.setAttribute(
                        "title",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    programarAjuste();
                };

                document.addEventListener("fullscreenchange", alCambiarPantalla);

                if (typeof ResizeObserver === "function") {
                    observador = new ResizeObserver(() => {
                        if (!visor.isConnected) {
                            observador.disconnect();
                            return;
                        }
                        if (
                            !estado.arrastrando &&
                            !estado.gestoPinza &&
                            estado.autoAjuste
                        ) {
                            programarAjuste();
                        }
                    });
                    observador.observe(escenario);
                }

                programarAjuste();
            }

            async function renderizarMarkdown(recurso, superficie, token) {
                const fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender) return;
                superficie.innerHTML = `
                    <article class="markdown">
                        ${window.marked ? marked.parse(fuente) : `<pre>${escaparHtml(fuente)}</pre>`}
                    </article>
                `;
                corregirRutasMarkdown(superficie, recurso.ruta);
            }

            async function renderizarCodigo(recurso, superficie, token) {
                let fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender) return;

                if (recurso.tipo === "json") {
                    try { fuente = JSON.stringify(JSON.parse(fuente), null, 2); } catch { /* original */ }
                }

                const pre = document.createElement("pre");
                pre.className = "codigo";
                pre.textContent = fuente;
                superficie.innerHTML = "";
                superficie.appendChild(pre);
            }

            async function renderizarDrawio(recurso, superficie, token) {
                const fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender) return;
                validarFuenteDrawio(fuente);

                superficie.innerHTML = "";

                const contenedor = document.createElement("div");
                contenedor.className = "drawio";

                const aviso = document.createElement("div");
                aviso.className = "drawio-aviso";
                aviso.innerHTML = `<span>DRAWIO</span><p>Diagrama interpretado desde el XML original de <code>${escaparHtml(recurso.nombre)}</code>.</p>`;

                const lienzo = document.createElement("div");
                lienzo.className = "drawio-render";
                lienzo.tabIndex = 0;

                const controles = document.createElement("div");
                controles.className = "drawio-controles";
                controles.innerHTML = `
                    <button type="button" data-zoom="menos" title="Alejar" aria-label="Alejar">−</button>
                    <button type="button" data-zoom="mas" title="Acercar" aria-label="Acercar">+</button>
                    <button type="button" data-ajustar>Ajustar</button>
                    <button type="button" data-pantalla title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
                `;

                const escenario = document.createElement("div");
                escenario.className = "drawio-escenario";

                const grafico = document.createElement("div");
                grafico.className = "mxgraph drawio-graph";
                grafico.setAttribute("data-mxgraph", JSON.stringify({
                    highlight: "#35c9f3",
                    nav: false,
                    lightbox: false,
                    "auto-fit": false,
                    responsive: false,
                    "dark-mode": "auto",
                    xml: fuente
                }));

                escenario.appendChild(grafico);
                lienzo.append(controles, escenario);
                contenedor.append(aviso, lienzo);
                superficie.appendChild(contenedor);

                await cargarVisorDrawio();
                if (token !== tokenRender || !grafico.isConnected) return;

                const visor = await crearVisorDrawio(grafico);
                if (token !== tokenRender || !grafico.isConnected) return;
                configurarLienzoDrawio(lienzo, escenario, grafico, visor);
            }

            function configurarLienzoDrawio(lienzo, escenario, grafico, visor) {
                const graph = visor?.graph;
                if (!graph || !graph.view) {
                    throw new Error(
                        "El visor de Draw.io no entregó un grafo utilizable."
                    );
                }

                graph.useScrollbarsForPanning = false;

                const estado = {
                    arrastrando: false,
                    puntero: null,
                    punteros: new Map(),
                    gestoPinza: null,
                    inicioX: 0,
                    inicioY: 0,
                    deltaX: 0,
                    deltaY: 0,
                    translateX: 0,
                    translateY: 0,
                    pantallaPendiente: false,
                    autoAjuste: true,
                    ajusteProgramado: null
                };

                const obtenerVista = () => graph.getView?.() || graph.view;
                const obtenerEscala = () => Number(obtenerVista()?.scale || 1);
                const limitarEscala = (escala) => Math.min(4, Math.max(0.12, escala));

                const actualizarDatoZoom = () => {
                    grafico.dataset.zoom = obtenerEscala().toFixed(3);
                };

                const aplicarEscalaYTraslacion = (escala, x, y) => {
                    const vista = obtenerVista();
                    graph.panGraph?.(0, 0);

                    if (typeof vista.scaleAndTranslate === "function") {
                        vista.scaleAndTranslate(escala, x, y);
                    } else {
                        vista.setScale?.(escala);
                        vista.setTranslate?.(x, y);
                    }

                    actualizarDatoZoom();
                };

                const ajustar = () => {
                    if (!lienzo.isConnected || !grafico.isConnected) return;
                    graph.panGraph?.(0, 0);
                    graph.fit?.(24);
                    estado.autoAjuste = true;
                    estado.deltaX = 0;
                    estado.deltaY = 0;
                    estado.gestoPinza = null;
                    actualizarDatoZoom();
                };

                const programarAjuste = () => {
                    if (estado.ajusteProgramado) {
                        cancelAnimationFrame(estado.ajusteProgramado);
                    }
                    estado.ajusteProgramado = requestAnimationFrame(() => {
                        estado.ajusteProgramado = requestAnimationFrame(() => {
                            estado.ajusteProgramado = null;
                            ajustar();
                        });
                    });
                };

                const cambiarZoom = (direccion) => {
                    const escala = obtenerEscala();
                    if (direccion > 0 && escala >= 4) return;
                    if (direccion < 0 && escala <= 0.12) return;

                    estado.autoAjuste = false;
                    graph.panGraph?.(0, 0);
                    if (direccion > 0) graph.zoomIn?.();
                    else graph.zoomOut?.();
                    actualizarDatoZoom();
                };

                const consolidarArrastre = () => {
                    if (!estado.arrastrando) return;
                    const vista = obtenerVista();
                    const escala = Number(vista.scale || 1) || 1;

                    graph.panGraph?.(0, 0);
                    vista.setTranslate?.(
                        estado.translateX + estado.deltaX / escala,
                        estado.translateY + estado.deltaY / escala
                    );

                    estado.arrastrando = false;
                    estado.puntero = null;
                    estado.deltaX = 0;
                    estado.deltaY = 0;
                    lienzo.classList.remove("arrastrando");
                };

                const iniciarArrastreCon = (puntero) => {
                    if (!puntero) return;
                    const vista = obtenerVista();

                    estado.arrastrando = true;
                    estado.puntero = puntero.id;
                    estado.inicioX = puntero.x;
                    estado.inicioY = puntero.y;
                    estado.translateX = Number(vista.translate?.x || 0);
                    estado.translateY = Number(vista.translate?.y || 0);
                    estado.deltaX = 0;
                    estado.deltaY = 0;
                    estado.autoAjuste = false;
                    lienzo.classList.add("arrastrando");
                };

                const obtenerDosPunteros = () =>
                    Array.from(estado.punteros.values()).slice(0, 2);

                const medirPinza = () => {
                    const [a, b] = obtenerDosPunteros();
                    if (!a || !b) return null;
                    return {
                        distancia: Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)),
                        centroX: (a.x + b.x) / 2,
                        centroY: (a.y + b.y) / 2
                    };
                };

                const iniciarPinza = () => {
                    const medida = medirPinza();
                    if (!medida) return;

                    consolidarArrastre();

                    const vista = obtenerVista();
                    const escala = Number(vista.scale || 1) || 1;
                    const rect = escenario.getBoundingClientRect();
                    const centroX = medida.centroX - rect.left;
                    const centroY = medida.centroY - rect.top;
                    const translateX = Number(vista.translate?.x || 0);
                    const translateY = Number(vista.translate?.y || 0);

                    estado.gestoPinza = {
                        distancia: medida.distancia,
                        escala,
                        graficoX: centroX / escala - translateX,
                        graficoY: centroY / escala - translateY
                    };
                    estado.autoAjuste = false;
                };

                const actualizarPinza = () => {
                    const medida = medirPinza();
                    const base = estado.gestoPinza;
                    if (!medida || !base) return;

                    const rect = escenario.getBoundingClientRect();
                    const centroX = medida.centroX - rect.left;
                    const centroY = medida.centroY - rect.top;
                    const escala = limitarEscala(
                        base.escala * (medida.distancia / base.distancia)
                    );
                    const translateX = centroX / escala - base.graficoX;
                    const translateY = centroY / escala - base.graficoY;

                    aplicarEscalaYTraslacion(escala, translateX, translateY);
                    estado.autoAjuste = false;
                };

                lienzo
                    .querySelector('[data-zoom="menos"]')
                    ?.addEventListener("click", () => cambiarZoom(-1));
                lienzo
                    .querySelector('[data-zoom="mas"]')
                    ?.addEventListener("click", () => cambiarZoom(1));
                lienzo
                    .querySelector("[data-ajustar]")
                    ?.addEventListener("click", programarAjuste);

                const botonPantalla = lienzo.querySelector("[data-pantalla]");

                botonPantalla?.addEventListener("click", async () => {
                    if (estado.pantallaPendiente) return;
                    estado.pantallaPendiente = true;
                    botonPantalla.disabled = true;

                    try {
                        if (document.fullscreenElement === lienzo) {
                            await document.exitFullscreen();
                        } else if (typeof lienzo.requestFullscreen === "function") {
                            await lienzo.requestFullscreen();
                        } else {
                            lienzo.classList.toggle(
                                "fullscreen-fallback"
                            );
                            programarAjuste();
                        }
                    } catch (error) {
                        console.warn(
                            "PW Hub: no fue posible cambiar el modo de pantalla completa.",
                            error
                        );
                    } finally {
                        estado.pantallaPendiente = false;
                        botonPantalla.disabled = false;
                    }
                });

                lienzo.addEventListener("pointerdown", (evento) => {
                    if (
                        evento.target.closest(".drawio-controles") ||
                        (evento.pointerType !== "touch" && evento.button !== 0)
                    ) {
                        return;
                    }

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });
                    lienzo.setPointerCapture?.(evento.pointerId);

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                    } else {
                        iniciarArrastreCon(estado.punteros.get(evento.pointerId));
                    }

                    evento.preventDefault();
                });

                lienzo.addEventListener("pointermove", (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });

                    if (estado.punteros.size >= 2) {
                        if (!estado.gestoPinza) iniciarPinza();
                        actualizarPinza();
                        evento.preventDefault();
                        return;
                    }

                    if (
                        estado.arrastrando &&
                        evento.pointerId === estado.puntero
                    ) {
                        estado.deltaX = evento.clientX - estado.inicioX;
                        estado.deltaY = evento.clientY - estado.inicioY;
                        graph.panGraph?.(estado.deltaX, estado.deltaY);
                        evento.preventDefault();
                    }
                });

                const terminarPuntero = (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    if (
                        estado.arrastrando &&
                        evento.pointerId === estado.puntero
                    ) {
                        consolidarArrastre();
                    }

                    estado.punteros.delete(evento.pointerId);
                    try {
                        lienzo.releasePointerCapture?.(evento.pointerId);
                    } catch {
                        // El navegador puede liberar la captura automáticamente.
                    }

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                        return;
                    }

                    estado.gestoPinza = null;

                    if (estado.punteros.size === 1) {
                        iniciarArrastreCon(Array.from(estado.punteros.values())[0]);
                        return;
                    }

                    estado.arrastrando = false;
                    estado.puntero = null;
                    lienzo.classList.remove("arrastrando");
                };

                lienzo.addEventListener("pointerup", terminarPuntero);
                lienzo.addEventListener("pointercancel", terminarPuntero);

                lienzo.addEventListener(
                    "wheel",
                    (evento) => {
                        if (!evento.ctrlKey) return;
                        evento.preventDefault();
                        cambiarZoom(evento.deltaY < 0 ? 1 : -1);
                    },
                    { passive: false }
                );

                let observador = null;

                const alCambiarPantalla = () => {
                    if (!lienzo.isConnected) {
                        document.removeEventListener(
                            "fullscreenchange",
                            alCambiarPantalla
                        );
                        observador?.disconnect();
                        return;
                    }

                    const activo =
                        document.fullscreenElement === lienzo ||
                        lienzo.classList.contains("fullscreen-fallback");

                    botonPantalla?.classList.toggle("activo", activo);
                    botonPantalla?.setAttribute(
                        "aria-label",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    botonPantalla?.setAttribute(
                        "title",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    programarAjuste();
                };

                document.addEventListener("fullscreenchange", alCambiarPantalla);

                if (typeof ResizeObserver === "function") {
                    observador = new ResizeObserver(() => {
                        if (!lienzo.isConnected) {
                            observador.disconnect();
                            return;
                        }
                        if (
                            !estado.arrastrando &&
                            !estado.gestoPinza &&
                            estado.autoAjuste
                        ) {
                            programarAjuste();
                        }
                    });
                    observador.observe(escenario);
                }

                programarAjuste();
            }

            function crearVisorDrawio(grafico) {
                return new Promise((resolver, rechazar) => {
                    let terminado = false;
                    const temporizador = setTimeout(() => {
                        if (terminado) return;
                        terminado = true;
                        rechazar(new Error("El visor de Draw.io no terminó de crear el diagrama."));
                    }, 5000);

                    try {
                        window.GraphViewer.createViewerForElement(grafico, (visor) => {
                            if (terminado) return;
                            terminado = true;
                            clearTimeout(temporizador);
                            resolver(visor);
                        });
                    } catch (error) {
                        clearTimeout(temporizador);
                        rechazar(error);
                    }
                });
            }

            function cargarVisorDrawio() {
                if (window.GraphViewer?.createViewerForElement) return Promise.resolve();
                if (promesaVisorDrawio) return promesaVisorDrawio;

                promesaVisorDrawio = new Promise((resolver, rechazar) => {
                    let terminado = false;
                    const finalizar = (error = null) => {
                        if (terminado) return;
                        terminado = true;
                        clearTimeout(temporizador);
                        error ? rechazar(error) : resolver();
                    };

                    const verificar = () => {
                        if (window.GraphViewer?.createViewerForElement) finalizar();
                        else finalizar(new Error("El visor oficial no expuso GraphViewer."));
                    };

                    window.onDrawioViewerLoad = verificar;
                    let script = document.querySelector("script[data-pw-drawio-viewer]");
                    if (!script) {
                        script = document.createElement("script");
                        script.src = DRAWIO_VIEWER_URL;
                        script.async = true;
                        script.dataset.pwDrawioViewer = VERSION;
                        document.head.appendChild(script);
                    }
                    script.addEventListener("load", verificar, { once: true });
                    script.addEventListener("error", () => finalizar(new Error("No fue posible descargar el visor Draw.io.")), { once: true });
                    const temporizador = setTimeout(() => finalizar(new Error("Draw.io excedió el tiempo de espera.")), 8000);
                }).catch((error) => {
                    promesaVisorDrawio = null;
                    throw error;
                });

                return promesaVisorDrawio;
            }

            function validarFuenteDrawio(fuente) {
                const documento = new DOMParser().parseFromString(fuente, "application/xml");
                if (documento.querySelector("parsererror")) throw new Error("XML Draw.io no válido.");
                const raiz = documento.documentElement?.tagName?.toLowerCase();
                if (raiz !== "mxfile" && raiz !== "mxgraphmodel") {
                    throw new Error("El XML no corresponde a Draw.io.");
                }
            }

            async function cargarFuente(ruta) {
                if (cacheFuente.has(ruta)) return cacheFuente.get(ruta);
                const respuesta = await fetch(ruta, { cache: "no-cache" });
                if (!respuesta.ok) throw new Error(`No fue posible cargar ${ruta}`);
                const fuente = await respuesta.text();
                cacheFuente.set(ruta, fuente);
                return fuente;
            }

            function fuenteActualReset() {
                // La caché por URL puede conservarse; cada recurso tiene su propia entrada.
            }

            function detectarProyecto(ruta) {
                const rutaAlumno = extraerRutaAlumno(ruta);
                const coincidencia = rutaAlumno.match(/^U([23])\/([^/]+)\/(.+)$/i);
                if (!coincidencia) return null;
                return {
                    unidad: Number(coincidencia[1]),
                    carpeta: coincidencia[2],
                    raiz: `U${coincidencia[1]}/${coincidencia[2]}/`,
                    rutaAlumno,
                    principal: rutaAlumno
                };
            }

            function extraerRutaAlumno(ruta) {
                try {
                    const url = new URL(ruta, window.location.href);
                    const pathname = decodeURIComponent(url.pathname);
                    const marca = `/${RAIZ_ALUMNO}/`;
                    const indice = pathname.indexOf(marca);
                    if (indice >= 0) return normalizarRutaRelativa(pathname.slice(indice + marca.length));
                } catch {
                    // Se intenta con la cadena tal cual.
                }
                return normalizarRutaRelativa(ruta);
            }

            function encontrarVisualDrawio(recurso) {
                const ruta = recurso.rutaAlumno;
                const punto = ruta.lastIndexOf(".");
                const base = punto >= 0 ? ruta.slice(0, punto) : ruta;
                const extensiones = ["png", "svg", "jpg", "jpeg", "webp"];
                return recursosProyecto.find((candidato) =>
                    extensiones.some((extension) =>
                        candidato.rutaAlumno.toLowerCase() === `${base}.${extension}`.toLowerCase()
                    )
                ) || null;
            }

            function obtenerCategoriaRecurso(ruta, tipo) {
                const minuscula = String(ruta).toLowerCase();
                if (tipo === "html" || tipo === "markdown") return "Página";
                if (["css", "js", "json", "txt", "texto", "xml"].includes(tipo)) return "Código";
                if (tipo === "drawio" || minuscula.startsWith("diseno/") || minuscula.startsWith("diseño/")) return "Diseño";
                if (esImagen(tipo)) return "Imágenes";
                if (tipo === "pdf") return "Documentos";
                return "Otros";
            }

            function compararRecursos(a, b, principal) {
                if (a.rutaAlumno === principal) return -1;
                if (b.rutaAlumno === principal) return 1;
                const ga = GRUPOS.indexOf(a.categoria);
                const gb = GRUPOS.indexOf(b.categoria);
                if (ga !== gb) return ga - gb;
                return a.relativa.localeCompare(b.relativa, "es", { numeric: true, sensitivity: "base" });
            }

            function corregirRutasMarkdown(contenedor, rutaDocumento) {
                const base = new URL(".", new URL(rutaDocumento, window.location.href));
                contenedor.querySelectorAll("img").forEach((imagen) => {
                    const src = imagen.getAttribute("src");
                    if (src && esRutaRelativa(src)) imagen.src = new URL(src, base).href;
                });
                contenedor.querySelectorAll("a").forEach((enlace) => {
                    const href = enlace.getAttribute("href");
                    if (href && esRutaRelativa(href)) enlace.href = new URL(href, base).href;
                    enlace.target = "_blank";
                    enlace.rel = "noopener noreferrer";
                });
            }

            function mostrarEstadoPagina(mensaje) {
                document.getElementById("contenedor-trabajo").innerHTML =
                    `<div class="estado-pagina">${escaparHtml(mensaje)}</div>`;
            }

            function obtenerTipoDesdeRuta(ruta) {
                const limpia = String(ruta || "").split(/[?#]/)[0];
                const extension = limpia.includes(".") ? limpia.split(".").pop().toLowerCase() : "archivo";
                return normalizarTipo(extension);
            }

            function normalizarTipo(tipo) {
                const valor = String(tipo || "").toLowerCase();
                if (valor === "md") return "markdown";
                if (valor === "htm") return "html";
                if (valor === "txt") return "texto";
                return valor || "archivo";
            }

            function formatearTipo(tipo) {
                const mapa = {
                    html: "HTML",
                    markdown: "Markdown",
                    pdf: "PDF",
                    texto: "Texto",
                    css: "CSS",
                    js: "JavaScript",
                    json: "JSON",
                    drawio: "Draw.io",
                    xml: "XML"
                };
                return mapa[tipo] || etiquetaTipo(tipo);
            }

            function etiquetaTipo(tipo) {
                const mapa = {
                    html: "HTML", markdown: "MD", css: "CSS", js: "JS", json: "JSON",
                    texto: "TXT", txt: "TXT", xml: "XML", drawio: "DRAWIO", png: "PNG",
                    jpg: "JPG", jpeg: "JPEG", webp: "WEBP", svg: "SVG", gif: "GIF", pdf: "PDF"
                };
                return mapa[tipo] || String(tipo || "FILE").toUpperCase();
            }

            function esImagen(tipo) {
                return ["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(tipo);
            }

            function esRutaRelativa(ruta) {
                return !/^(?:https?:|mailto:|data:|#)/i.test(ruta);
            }

            function normalizarRutaRelativa(ruta) {
                let valor = String(ruta || "").replace(/\\/g, "/").split(/[?#]/)[0].trim();
                try { valor = decodeURIComponent(valor); } catch { /* original */ }
                while (valor.startsWith("../")) valor = valor.slice(3);
                while (valor.startsWith("./")) valor = valor.slice(2);
                return valor.replace(/^\/+/, "");
            }

            function limpiarNombreCarpeta(carpeta) {
                return String(carpeta || "Proyecto")
                    .replace(/^U\d+\.?\s*/i, "")
                    .replace(/^A\d+\s*-\s*/i, "")
                    .replace(/^Act\s*\d+\s*-\s*/i, "")
                    .trim() || "Proyecto";
            }

            function escaparHtml(texto) {
                const div = document.createElement("div");
                div.textContent = String(texto ?? "");
                return div.innerHTML;
            }
        })();
    </script>
</body>
</html>
