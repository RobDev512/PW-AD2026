<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#070d12">
    <title>Trabajo - PW Hub</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/branding/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/branding/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/branding/favicon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="../assets/branding/favicon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --fondo: #070d12;
            --fondo-secundario: #0b1219;
            --panel: #0e171f;
            --panel-suave: #111c25;
            --borde: #253543;
            --texto: #f4f7fa;
            --texto-secundario: #9db0bf;
            --acento: #35c9f3;
            --acento-rgb: 53, 201, 243;
            --papel: #f6f8fa;
            --codigo: #0b1219;
        }

        html {
            min-height: 100%;
            background: var(--fondo);
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% -10%, rgba(var(--acento-rgb), .08), transparent 30%),
                var(--fondo);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        a { font: inherit; }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--acento);
            outline-offset: 3px;
        }

        .barra-trabajo {
            position: sticky;
            top: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 72px;
            padding: 11px max(18px, calc((100vw - 1440px) / 2));
            border-bottom: 1px solid var(--borde);
            background: #091118;
        }

        .barra-identidad {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .barra-logo {
            flex: 0 0 auto;
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .barra-titulo { min-width: 0; }

        .barra-etiqueta {
            margin: 0 0 3px;
            color: var(--acento);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .barra-trabajo h1 {
            overflow: hidden;
            margin: 0;
            font-size: clamp(17px, 2.4vw, 22px);
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .barra-acciones {
            display: flex;
            flex: 0 0 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .barra-accion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-secundario);
            background: var(--panel);
            text-decoration: none;
            font-size: 10px;
            font-weight: 800;
        }

        .barra-accion:hover {
            color: white;
            border-color: var(--acento);
        }

        .barra-accion.primaria {
            color: var(--acento);
            border-color: rgba(var(--acento-rgb), .48);
            background: rgba(var(--acento-rgb), .06);
        }

        .barra-accion[hidden] { display: none !important; }

        .contenedor-trabajo {
            width: min(1440px, calc(100% - 24px));
            min-width: 0;
            margin: 14px auto 22px;
            container-name: pw-trabajo;
            container-type: inline-size;
        }

        .estado-pagina {
            display: grid;
            min-height: calc(100dvh - 112px);
            place-items: center;
            padding: 32px;
            border: 1px solid var(--borde);
            border-radius: 14px;
            color: var(--texto-secundario);
            background: var(--panel);
            text-align: center;
        }

        /* Proyecto completo */
        .proyecto-shell {
            container-name: pw-proyecto;
            container-type: inline-size;
            display: grid;
            grid-template-columns: minmax(240px, 305px) minmax(0, 1fr);
            height: calc(100dvh - 108px);
            min-height: 560px;
            overflow: hidden;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 15px;
            background: var(--panel);
            box-shadow: 0 18px 54px rgba(0, 0, 0, .24);
        }

        .proyecto-archivos {
            min-width: 0;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            border-right: 1px solid var(--borde);
            background: var(--panel);
        }

        .proyecto-cabecera {
            position: sticky;
            top: 0;
            z-index: 4;
            padding: 16px;
            border-bottom: 1px solid var(--borde);
            background: var(--panel);
        }

        .proyecto-cabecera-linea {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .proyecto-cabecera-linea span,
        .recurso-info > span {
            color: var(--acento);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .proyecto-cabecera-linea strong {
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .proyecto-cabecera h2 {
            margin: 9px 0 6px;
            color: var(--texto);
            font-size: 15px;
            line-height: 1.35;
        }

        .proyecto-cabecera p {
            margin: 0 0 8px;
            color: var(--texto-secundario);
            font-size: 9px;
            line-height: 1.55;
        }

        .proyecto-cabecera code {
            display: block;
            overflow: hidden;
            color: var(--texto-secundario);
            font-size: 8px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .proyecto-lista { padding: 11px; }

        .proyecto-grupo + .proyecto-grupo { margin-top: 15px; }

        .proyecto-grupo h3 {
            margin: 0 0 7px;
            padding: 0 4px;
            color: var(--texto-secundario);
            font-size: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .proyecto-grupo-lista {
            display: grid;
            gap: 6px;
        }

        .proyecto-archivo {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
            width: 100%;
            min-height: 52px;
            padding: 7px 8px;
            cursor: pointer;
            border: 1px solid var(--borde);
            border-radius: 9px;
            color: var(--texto);
            background: var(--fondo-secundario);
            text-align: left;
        }

        .proyecto-archivo:hover,
        .proyecto-archivo.activo {
            border-color: rgba(var(--acento-rgb), .7);
            background: rgba(var(--acento-rgb), .07);
        }

        .proyecto-archivo.activo {
            box-shadow: inset 3px 0 0 var(--acento);
        }

        .archivo-extension {
            display: inline-grid;
            place-items: center;
            min-height: 27px;
            padding: 0 5px;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 6px;
            color: var(--acento);
            font-size: 8px;
            font-weight: 800;
            line-height: 1;
            white-space: nowrap;
        }

        .archivo-texto { min-width: 0; }

        .archivo-texto strong,
        .archivo-texto small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .archivo-texto strong { font-size: 10px; }
        .archivo-texto small {
            margin-top: 3px;
            color: var(--texto-secundario);
            font-size: 8px;
        }

        .proyecto-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--panel);
        }

        .recurso-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-width: 0;
            min-height: 72px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--borde);
            background: var(--panel);
        }

        .recurso-info {
            flex: 1 1 280px;
            min-width: 0;
        }

        .recurso-info strong,
        .recurso-info code {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .recurso-info strong {
            margin-top: 2px;
            font-size: 12px;
        }

        .recurso-info code {
            margin-top: 3px;
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .recurso-modos {
            display: flex;
            flex: 0 1 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 6px;
            min-width: 0;
        }

        .recurso-modo {
            min-height: 34px;
            padding: 6px 10px;
            cursor: pointer;
            border: 1px solid var(--borde);
            border-radius: 8px;
            color: var(--texto-secundario);
            background: var(--fondo-secundario);
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .recurso-modo:hover,
        .recurso-modo.activo {
            color: var(--texto);
            border-color: rgba(var(--acento-rgb), .72);
        }

        .recurso-modo.activo {
            color: var(--acento);
            background: rgba(var(--acento-rgb), .09);
        }

        .superficie {
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            background: var(--panel);
        }

        .superficie.iframe { overflow: hidden; scrollbar-gutter: auto; }

        .frame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            background: white;
        }

        .presentacion-descarga {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
            min-height: 38px;
            padding: 9px 14px;
            border: 1px solid var(--acento);
            border-radius: 8px;
            color: var(--texto);
            background: rgba(var(--acento-rgb), 0.12);
            text-decoration: none;
            font-weight: 700;
        }

        .estado-recurso {
            display: grid;
            min-height: 100%;
            place-items: center;
            align-content: center;
            gap: 8px;
            padding: 30px;
            color: var(--texto-secundario);
            text-align: center;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--borde);
            border-top-color: var(--acento);
            border-radius: 50%;
            animation: giro .8s linear infinite;
        }

        @keyframes giro { to { transform: rotate(360deg); } }

        .codigo {
            width: max-content;
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 22px;
            color: #dce8ef;
            background: var(--codigo);
            white-space: pre;
            tab-size: 4;
            font-family: Consolas, "Cascadia Code", "Courier New", monospace;
            font-size: 12px;
            line-height: 1.65;
        }

        .imagen-visor {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--papel);
        }

        .imagen-escenario {
            position: absolute;
            inset: 0;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            background:
                linear-gradient(rgba(35, 55, 70, .055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(35, 55, 70, .055) 1px, transparent 1px),
                var(--papel);
            background-size: 20px 20px;
        }

        .imagen-escenario.arrastrando {
            cursor: grabbing;
        }

        .imagen-zoomable {
            position: absolute;
            left: 50%;
            top: 50%;
            display: block;
            max-width: none;
            max-height: none;
            transform: translate(-50%, -50%);
            user-select: none;
            -webkit-user-drag: none;
        }

        .imagen-controles {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 12;
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid rgba(25, 45, 60, .25);
            border-radius: 9px;
            background: rgba(10, 18, 24, .94);
        }

        .imagen-controles button {
            min-width: 34px;
            height: 32px;
            padding: 0 9px;
            cursor: pointer;
            border: 1px solid rgba(157, 176, 191, .28);
            border-radius: 6px;
            color: #dce8ef;
            background: #111c25;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .imagen-controles button:hover,
        .imagen-controles button.activo {
            color: white;
            border-color: rgba(var(--acento-rgb), .72);
        }

        .imagen-visor:fullscreen,
        .imagen-visor.fullscreen-fallback {
            width: 100vw;
            height: 100vh;
            background: var(--papel);
        }

        .imagen-visor.fullscreen-fallback {
            position: fixed;
            inset: 0;
            z-index: 100000;
        }

        .markdown {
            min-height: 100%;
            padding: 28px clamp(22px, 5vw, 58px) 42px;
            color: #dce8ef;
            background: var(--fondo-secundario);
            line-height: 1.75;
        }

        .markdown > * { max-width: 920px; margin-left: auto; margin-right: auto; }
        .markdown img { max-width: 100%; height: auto; }
        .markdown a { color: var(--acento); }
        .markdown pre { overflow-x: auto; padding: 16px; border-radius: 9px; background: #070c11; }
        .markdown code { font-family: Consolas, "Cascadia Code", monospace; }
        .markdown table { width: 100%; border-collapse: collapse; }
        .markdown th, .markdown td { padding: 9px 11px; border: 1px solid var(--borde); text-align: left; }

        /* Draw.io */
        .drawio {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            background: var(--panel);
        }

        .drawio-aviso {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--borde);
            color: var(--texto-secundario);
            font-size: 9px;
        }

        .drawio-aviso span {
            flex: 0 0 auto;
            padding: 4px 7px;
            border: 1px solid rgba(var(--acento-rgb), .42);
            border-radius: 20px;
            color: var(--acento);
            font-weight: 800;
            white-space: nowrap;
        }

        .drawio-aviso p { margin: 0; }

        .drawio-render {
            position: relative;
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            background:
                linear-gradient(rgba(35, 55, 70, .07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(35, 55, 70, .07) 1px, transparent 1px),
                #f5f6f8;
            background-size: 20px 20px;
        }

        .drawio-render.arrastrando { cursor: grabbing; }
        .drawio-escenario { position: absolute; inset: 0; overflow: hidden; }

        .drawio-graph {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            min-height: 0;
            max-width: none;
            max-height: none;
            overflow: hidden;
            background: #fff;
            transform: none !important;
        }

        .drawio-controles {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 12;
            display: flex;
            gap: 5px;
            padding: 4px;
            border: 1px solid rgba(25, 45, 60, .25);
            border-radius: 9px;
            background: rgba(10, 18, 24, .94);
        }

        .drawio-controles button {
            min-width: 34px;
            height: 32px;
            padding: 0 9px;
            cursor: pointer;
            border: 1px solid rgba(157, 176, 191, .28);
            border-radius: 6px;
            color: #dce8ef;
            background: #111c25;
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .drawio-controles button:hover,
        .drawio-controles button.activo {
            color: white;
            border-color: rgba(var(--acento-rgb), .72);
        }

        .drawio-render:fullscreen,
        .drawio-render.fullscreen-fallback {
            width: 100vw;
            height: 100vh;
        }

        .drawio-render.fullscreen-fallback {
            position: fixed;
            inset: 0;
            z-index: 100000;
        }

        /* Archivo individual fuera de proyecto */
        .visor-simple {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            min-height: calc(100dvh - 108px);
            overflow: hidden;
            border: 1px solid rgba(var(--acento-rgb), .34);
            border-radius: 15px;
            background: var(--panel);
        }

        /*
           El shell no puede consultarse a si mismo. La consulta usa el
           contenedor padre para decidir cuando las dos columnas ya no caben.
        */
        @container pw-trabajo (max-width: 760px) {
            .proyecto-shell {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(150px, 31vh) minmax(0, 1fr);
            }

            .proyecto-archivos {
                border-right: 0;
                border-bottom: 1px solid var(--borde);
            }
        }

        @container pw-proyecto (max-width: 620px) {
            .recurso-toolbar {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                align-items: start;
                align-content: start;
                gap: 8px;
            }

            .recurso-info {
                width: 100%;
                min-width: 0;
                min-height: 0;
                flex: none;
            }

            .recurso-modos {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
                width: 100%;
                min-width: 0;
                justify-content: stretch;
            }

            .recurso-modo {
                width: 100%;
                min-width: 0;
                min-height: 34px;
                height: auto;
                flex: none;
            }
        }

        /* Mantenimiento U4 C4: toda vista usa el alto libre real de la pantalla.
           Código original, Markdown, imagen, PDF, proyectos y laboratorio
           desplazan su propio contenido, no toda la pagina. */
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        .barra-trabajo { position: relative; flex: 0 0 auto; }
        .contenedor-trabajo {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            margin-top: 12px;
            margin-bottom: 12px;
        }
        .visor-simple, .proyecto-shell {
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            max-height: 100%;
            height: 100%;
        }
        .estado-pagina { flex: 1 1 auto; min-height: 0; }
        .proyecto-panel > .superficie {
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }
        .proyecto-panel > .superficie.iframe { overflow: hidden; scrollbar-gutter: auto; }
        .proyecto-panel.js-modo-activo > .superficie { overflow: hidden; scrollbar-gutter: auto; }
        @media (max-width: 720px) {
            .contenedor-trabajo { margin-top: 6px; margin-bottom: 6px; }
            .proyecto-shell, .visor-simple { min-height: 0; }
        }
        /* Editor/console have their own scroll regions, never the whole page. */
        .js-laboratorio {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            padding: clamp(8px, 1.4vw, 16px);
            background: var(--fondo-secundario);
        }
        .js-lab-cabecera { display: flex; gap: 13px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .js-lab-titulo { display: grid; gap: 4px; min-width: 0; }
        .js-lab-titulo > span { color: var(--acento); letter-spacing: 1.1px; font-weight: 850; font-size: 9px; }
        .js-lab-titulo > strong { font-size: 17px; color: var(--texto); }
        .js-lab-titulo > small { font-size: 10px; color: var(--texto-secundario); }
        .js-acciones { display: flex; flex-wrap: wrap; gap: 7px; }
        .js-acciones button, .js-lab-panel-titulo button {
            cursor: pointer; min-height: 33px; padding: 6px 11px; border: 1px solid rgba(var(--acento-rgb), .4);
            border-radius: 8px; color: var(--texto); background: rgba(var(--acento-rgb), .08); font-size: 11px; font-weight: 700; line-height: 1.35; font-family: inherit;
        }
        .js-acciones button:first-child { background: rgba(var(--acento-rgb), .17); border-color: rgba(var(--acento-rgb), .7); }
        .js-acciones button:disabled { opacity: .4; cursor: default; }
        .js-lab-columnas { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0, .85fr); grid-template-rows: minmax(0,1fr); gap: 12px; min-height: 0; flex: 1 1 auto; overflow: hidden; }
        .js-lab-panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 1px solid var(--borde); border-radius: 11px; overflow: hidden; background: #091118; }
        .js-lab-panel-titulo { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 43px; padding: 8px 12px; border-bottom: 1px solid var(--borde); font: 750 11px/1.4 ui-monospace, Consolas, monospace; }
        .js-lab-panel-titulo span { color: var(--acento); }
        .js-lab-panel-titulo em { font-size: 9px; font-style: normal; color: #efb773; }
        .js-lab-panel-titulo small { color: var(--texto-secundario); font-size: 10px; }
        .js-lab-panel-titulo button { min-height: 27px; font-size: 10px; }

        /* Pregunta real: el Worker espera la respuesta en este formulario. */

<body>
    <header class="barra-trabajo">
        <div class="barra-identidad">
            <img src="../assets/branding/isotipo-pwhub.png" alt="" class="barra-logo" aria-hidden="true">
            <div class="barra-titulo">
                <p class="barra-etiqueta" id="tipo-trabajo">Trabajo</p>
                <h1 id="titulo-trabajo">Cargando trabajo...</h1>
            </div>
        </div>

        <div class="barra-acciones">
            <a href="#" class="barra-accion primaria" id="abrir-original" target="_blank" rel="noopener noreferrer" hidden>
                Abrir archivo original
            </a>
            <a href="../index.html" class="barra-accion secundaria" id="volver-hub">Volver al Hub</a>
        </div>
    </header>

    <main class="contenedor-trabajo" id="contenedor-trabajo">
        <div class="estado-pagina">Cargando trabajo...</div>
    </main>

    <script>
        (() => {
            "use strict";

            const VERSION = "1.2.2";
            const REPOSITORIO = "RobDev512/PW-AD2026";
            const RAMA = "main";
            const RAIZ_ALUMNO = "23400614_Rodríguez_Magaña_Roberto_Carlos";
            const DRAWIO_VIEWER_URL = "https://viewer.diagrams.net/js/viewer-static.min.js";

            const FALLBACKS = {
                "U2/U2 Act 1 - Ejercicio1/": ["Ejercicio1 - U2 Act 1.html", "pan-frances.png"],
                "U2/U2 Act 2 - Ejercicio2/": ["Ejercicio2 - U2 Act 2.html", "tears-for-fears.jpg"],
                "U2/U2 Act 5 - Ejercicio5/": ["Ejercicio5 - U2 Act 5.html", "Michael.jpg"],
                "U3/U3. A4 - Ej1/": ["Ej1 - U3A4.html", "pan-frances.png"],
                "U3/U3. A5 - Ej2/": ["Ej2 - U3A5.html", "tears-for-fears.jpg"],
                "U3/U3. A6 - Instagram/": [
                    "Perfil - U3A6.html",
                    "css/styles.css",
                    "diseno/Perfil - U3A6.drawio",
                    "diseno/Perfil - U3A6.png",
                    "img/perfil/foto.jpg",
                    "img/publicaciones/publicacion-01.png",
                    "img/publicaciones/publicacion-02.png",
                    "img/publicaciones/publicacion-03.png",
                    "img/publicaciones/publicacion-04.png",
                    "img/publicaciones/publicacion-05.png",
                    "img/publicaciones/publicacion-06.png",
                    "img/publicaciones/publicacion-07.png",
                    "img/publicaciones/publicacion-08.png",
                    "img/publicaciones/publicacion-09.png"
                ],
                "U4/U4. A1. Tarea 1/": [
                    "U4. A1. Tarea 1.pdf",
                    "U4. A1. Tarea 1.PNG",
                    "U4. A1. Tarea 1.pptx"
                ]
            };

            const GRUPOS = ["Página", "Código", "Diseño", "Imágenes", "Documentos", "Otros"];
            const cacheFuente = new Map();
            let promesaVisorDrawio = null;
            let tokenRender = 0;
            let ejecucionJSActiva = null;

            let rutaTrabajo = "";
            let tipoTrabajo = "";
            let tituloTrabajo = "";
            let infoProyecto = null;
            let recursosProyecto = [];
            let recursoActual = null;
            let modoActual = "diseno";
            let trabajoCatalogo = null;

            document.addEventListener("DOMContentLoaded", iniciar);

            async function iniciar() {
                configurarVolverHub();

                const parametros = new URLSearchParams(window.location.search);
                rutaTrabajo = parametros.get("archivo") || "";
                tipoTrabajo = normalizarTipo(parametros.get("tipo") || obtenerTipoDesdeRuta(rutaTrabajo));
                tituloTrabajo = parametros.get("titulo") || "Trabajo";

                if (!rutaTrabajo) {
                    mostrarEstadoPagina("No se indicó un archivo para mostrar.");
                    return;
                }

                infoProyecto = detectarProyecto(rutaTrabajo);

                if (infoProyecto) {
                    await iniciarProyecto();
                } else {
                    iniciarArchivoIndividual();
                }
            }

            function configurarVolverHub() {
                const volver = document.getElementById("volver-hub");
                volver?.addEventListener("click", (evento) => {
                    try {
                        const referencia = document.referrer ? new URL(document.referrer) : null;
                        const mismaAplicacion = referencia &&
                            referencia.origin === window.location.origin &&
                            referencia.pathname.includes("/hub/");

                        if (mismaAplicacion && window.history.length > 1) {
                            evento.preventDefault();
                            window.history.back();
                        }
                    } catch {
                        // El enlace normal sigue siendo el fallback.
                    }
                });
            }

            async function iniciarProyecto() {
                mostrarEstadoPagina("Explorando archivos del proyecto...");

                trabajoCatalogo = await obtenerTrabajoCatalogo(infoProyecto).catch(() => null);
                const nombreProyecto = trabajoCatalogo?.nombre || limpiarNombreCarpeta(infoProyecto.carpeta);
                const descripcion = trabajoCatalogo?.descripcion || "Proyecto académico organizado por carpeta.";

                infoProyecto.principal = normalizarRutaRelativa(trabajoCatalogo?.ruta || infoProyecto.rutaAlumno);

                document.getElementById("tipo-trabajo").textContent =
                    `U${infoProyecto.unidad} · Proyecto por carpeta`;
                document.getElementById("titulo-trabajo").textContent = nombreProyecto;
                document.title = `${nombreProyecto} - PW Hub`;

                recursosProyecto = await obtenerRecursosProyecto(infoProyecto);

                // La ruta pública de la Tarea 1 señala al PNG (válido aun antes
                // de publicar el PDF en GitHub), pero el visor inicia con el PDF.
                const pdfTarea = infoProyecto.unidad === 4 &&
                    infoProyecto.carpeta === "U4. A1. Tarea 1" &&
                    tituloTrabajo === "Actividad 1 - Tarea 1"
                        ? recursosProyecto.find((recurso) => recurso.tipo === "pdf")
                        : null;
                recursoActual = pdfTarea || recursosProyecto.find((recurso) =>
                    recurso.rutaAlumno === infoProyecto.rutaAlumno
                ) || recursosProyecto.find((recurso) =>
                    recurso.rutaAlumno === infoProyecto.principal
                ) || recursosProyecto[0] || crearRecurso(infoProyecto.rutaAlumno, infoProyecto);

                construirWorkspaceProyecto(nombreProyecto, descripcion);
                seleccionarRecurso(recursoActual);
            }

            function iniciarArchivoIndividual() {
                document.getElementById("tipo-trabajo").textContent = formatearTipo(tipoTrabajo);
                document.getElementById("titulo-trabajo").textContent = tituloTrabajo;
                document.title = `${tituloTrabajo} - PW Hub`;

                const recurso = {
                    nombre: tituloTrabajo,
                    ruta: new URL(rutaTrabajo, window.location.href).href,
                    rutaAlumno: "",
                    relativa: tituloTrabajo,
                    tipo: tipoTrabajo,
                    categoria: "Trabajo"
                };

                document.getElementById("contenedor-trabajo").innerHTML = `
                    <section class="visor-simple proyecto-panel">
                        <header class="recurso-toolbar">
                            <div class="recurso-info">
                                <span>Archivo</span>
                                <strong id="recurso-nombre"></strong>
                                <code id="recurso-ruta"></code>
                            </div>
                            <div class="recurso-modos" id="recurso-modos"></div>
                        </header>
                        <div class="superficie" id="superficie"></div>
                    </section>
                `;

                recursoActual = recurso;
                seleccionarRecurso(recurso);
            }

            async function obtenerTrabajoCatalogo(info) {
                const respuesta = await fetch("../data/unidades.json", { cache: "no-cache" });
                if (!respuesta.ok) return null;
                const datos = await respuesta.json();
                const trabajos = (datos?.unidades || []).flatMap((unidad) => unidad?.trabajos || []);
                return trabajos.find((trabajo) => {
                    const ruta = normalizarRutaRelativa(trabajo?.ruta || "");
                    return ruta.startsWith(info.raiz);
                }) || null;
            }

            async function obtenerRecursosProyecto(info) {
                try {
                    const url = `https://api.github.com/repos/${REPOSITORIO}/git/trees/${encodeURIComponent(RAMA)}?recursive=1`;
                    const respuesta = await fetch(url, {
                        headers: { Accept: "application/vnd.github+json" },
                        cache: "no-store"
                    });

                    if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);
                    const datos = await respuesta.json();
                    const prefijo = `${RAIZ_ALUMNO}/${info.raiz}`;
                    const recursos = (datos.tree || [])
                        .filter((elemento) =>
                            elemento?.type === "blob" &&
                            typeof elemento.path === "string" &&
                            elemento.path.startsWith(prefijo)
                        )
                        .map((elemento) =>
                            crearRecurso(elemento.path.slice(RAIZ_ALUMNO.length + 1), info)
                        );

                    if (recursos.length) {
                        return recursos.sort((a, b) => compararRecursos(a, b, info.principal));
                    }
                } catch (error) {
                    console.warn("PW Hub: se usará el inventario local del proyecto.", error);
                }

                const rutas = FALLBACKS[info.raiz] || [info.rutaAlumno.slice(info.raiz.length)];
                const recursos = rutas.map((ruta) => crearRecurso(`${info.raiz}${ruta}`, info));

                if (!recursos.some((recurso) => recurso.rutaAlumno === info.rutaAlumno)) {
                    recursos.unshift(crearRecurso(info.rutaAlumno, info));
                }

                return recursos.sort((a, b) => compararRecursos(a, b, info.principal));
            }

            function crearRecurso(rutaAlumno, info) {
                const rutaNormalizada = normalizarRutaRelativa(rutaAlumno);
                const relativa = rutaNormalizada.startsWith(info.raiz)
                    ? rutaNormalizada.slice(info.raiz.length)
                    : rutaNormalizada;
                const nombre = relativa.split("/").pop() || relativa;
                const tipo = obtenerTipoDesdeRuta(rutaNormalizada);

                return {
                    ruta: new URL(`../../${rutaNormalizada}`, window.location.href).href,
                    rutaAlumno: rutaNormalizada,
                    relativa,
                    nombre,
                    tipo,
                    categoria: obtenerCategoriaRecurso(relativa, tipo)
                };
            }

            function construirWorkspaceProyecto(nombre, descripcion) {
                const grupos = agruparRecursos(recursosProyecto);

                document.getElementById("contenedor-trabajo").innerHTML = `
                    <section class="proyecto-shell">
                        <aside class="proyecto-archivos" aria-label="Archivos del proyecto">
                            <header class="proyecto-cabecera">
                                <div class="proyecto-cabecera-linea">
                                    <span>Proyecto completo</span>
                                    <strong>${recursosProyecto.length} ${recursosProyecto.length === 1 ? "archivo" : "archivos"}</strong>
                                </div>
                                <h2>${escaparHtml(nombre)}</h2>
                                <p>${escaparHtml(descripcion)}</p>
                                <code>${escaparHtml(infoProyecto.raiz)}</code>
                            </header>
                            <div class="proyecto-lista">
                                ${grupos.map(renderizarGrupo).join("")}
                            </div>
                        </aside>

                        <section class="proyecto-panel">
                            <header class="recurso-toolbar">
                                <div class="recurso-info">
                                    <span id="recurso-categoria">Archivo</span>
                                    <strong id="recurso-nombre">Selecciona un recurso</strong>
                                    <code id="recurso-ruta"></code>
                                </div>
                                <div class="recurso-modos" id="recurso-modos" role="group" aria-label="Modo de visualización"></div>
                            </header>
                            <div class="superficie" id="superficie"></div>
                        </section>
                    </section>
                `;

                document.querySelectorAll("[data-recurso]").forEach((boton) => {
                    boton.addEventListener("click", () => {
                        const recurso = recursosProyecto[Number(boton.dataset.recurso)];
                        if (recurso) seleccionarRecurso(recurso);
                    });
                });
            }

            function agruparRecursos(recursos) {
                return GRUPOS.map((categoria) => ({
                    categoria,
                    recursos: recursos
                        .map((recurso, indice) => ({ ...recurso, indice }))
                        .filter((recurso) => recurso.categoria === categoria)
                })).filter((grupo) => grupo.recursos.length > 0);
            }

            function renderizarGrupo(grupo) {
                return `
                    <section class="proyecto-grupo">
                        <h3>${escaparHtml(grupo.categoria)}</h3>
                        <div class="proyecto-grupo-lista">
                            ${grupo.recursos.map((recurso) => `
                                <button type="button" class="proyecto-archivo" data-recurso="${recurso.indice}" title="${escaparHtml(recurso.relativa)}">
                                    <span class="archivo-extension">${escaparHtml(etiquetaTipo(recurso.tipo))}</span>
                                    <span class="archivo-texto">
                                        <strong>${escaparHtml(recurso.nombre)}</strong>
                                        <small>${escaparHtml(recurso.relativa)}</small>
                                    </span>
                                </button>
                            `).join("")}
                        </div>
                    </section>
                `;
            }

            function seleccionarRecurso(recurso) {
                recursoActual = recurso;
                tokenRender += 1;
                fuenteActualReset();

                document.querySelectorAll("[data-recurso]").forEach((boton) => {
                    const candidato = recursosProyecto[Number(boton.dataset.recurso)];
                    boton.classList.toggle("activo", candidato?.rutaAlumno === recurso.rutaAlumno);
                });

                const nombre = document.getElementById("recurso-nombre");
                const ruta = document.getElementById("recurso-ruta");
                const categoria = document.getElementById("recurso-categoria");

                if (nombre) nombre.textContent = recurso.nombre;
                if (ruta) ruta.textContent = recurso.relativa || recurso.ruta;
                if (categoria) categoria.textContent = recurso.categoria || formatearTipo(recurso.tipo);

                const abrir = document.getElementById("abrir-original");
                abrir.href = recurso.ruta;
                abrir.hidden = false;

                const modos = obtenerModosRecurso(recurso);
                modoActual = modos[0]?.id || "codigo";
                construirBotonesModo(modos);
                renderizarRecurso(recurso, modoActual, tokenRender);
            }

            function construirBotonesModo(modos) {
                const contenedor = document.getElementById("recurso-modos");
                if (!contenedor) return;

                contenedor.innerHTML = modos.map((modo) => `
                    <button type="button" class="recurso-modo ${modo.id === modoActual ? "activo" : ""}" data-modo="${modo.id}">
                        ${escaparHtml(modo.etiqueta)}
                    </button>
                `).join("");

                contenedor.querySelectorAll("[data-modo]").forEach((boton) => {
                    boton.addEventListener("click", () => {
                        modoActual = boton.dataset.modo;
                        contenedor.querySelectorAll(".recurso-modo").forEach((elemento) =>
                            elemento.classList.toggle("activo", elemento === boton)
                        );
                        tokenRender += 1;
                        detenerEjecucionJS();
                        renderizarRecurso(recursoActual, modoActual, tokenRender);
                    });
                });
            }

            function obtenerModosRecurso(recurso) {
                if (recurso.tipo === "html") {
                    return [
                        { id: "diseno", etiqueta: "Diseño" },
                        { id: "codigo", etiqueta: "Código HTML" }
                    ];
                }

                if (recurso.tipo === "markdown") {
                    return [
                        { id: "diseno", etiqueta: "Vista" },
                        { id: "codigo", etiqueta: "Markdown" }
                    ];
                }

                if (recurso.tipo === "js") {
                    return [
                        { id: "ejecutar", etiqueta: "Editor y consola" },
                        { id: "codigo", etiqueta: "Código original" }
                    ];
                }

                if (recurso.tipo === "drawio") {
                    const modos = [{ id: "diagrama", etiqueta: "Diagrama" }];
                    if (encontrarVisualDrawio(recurso)) modos.push({ id: "png", etiqueta: "PNG" });
                    modos.push({ id: "codigo", etiqueta: "XML" });
                    return modos;
                }

                if (recurso.tipo === "pdf" || esImagen(recurso.tipo)) {
                    return [{ id: "diseno", etiqueta: "Vista" }];
                }
                if (recurso.tipo === "pptx" || recurso.tipo === "ppt") {
                    return [{ id: "presentacion", etiqueta: "PowerPoint" }];
                }

                return [{ id: "codigo", etiqueta: etiquetaTipo(recurso.tipo) }];
            }

            async function renderizarRecurso(recurso, modo, token) {
                const superficie = document.getElementById("superficie");
                if (!superficie || !recurso) return;

                // Modo laboratorio limita la superficie al alto de la ventana.
                superficie.closest(".proyecto-panel")?.classList.toggle(
                    "js-modo-activo", recurso.tipo === "js" && modo === "ejecutar"
                );
                if (typeof superficie.pwPptxCleanup === "function") superficie.pwPptxCleanup();
                superficie.classList.remove("iframe");
                superficie.innerHTML = `
                    <div class="estado-recurso">
                        <span class="spinner" aria-hidden="true"></span>
                        <span>Cargando ${escaparHtml(recurso.nombre)}...</span>
                    </div>
                `;

                try {
                    if (recurso.tipo === "html" || recurso.tipo === "pdf") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else {
                            renderizarIframe(recurso, superficie);
                        }
                    } else if (recurso.tipo === "js") {
                        if (modo === "ejecutar") {
                            await renderizarEjecutorJS(recurso, superficie, token);
                        } else {
                            await renderizarCodigo(recurso, superficie, token);
                        }
                    } else if (recurso.tipo === "markdown") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else {
                            await renderizarMarkdown(recurso, superficie, token);
                        }
                    } else if (esImagen(recurso.tipo)) {
                        renderizarImagen(recurso, superficie);
                    } else if (recurso.tipo === "pptx") {
                        await renderizarPresentacion(recurso, superficie, token);
                    } else if (recurso.tipo === "ppt") {
                        throw new Error("El formato PPT antiguo no está soportado; se necesita PPTX.");
                    } else if (recurso.tipo === "drawio") {
                        if (modo === "codigo") {
                            await renderizarCodigo(recurso, superficie, token);
                        } else if (modo === "png") {
                            const visual = encontrarVisualDrawio(recurso);
                            if (!visual) throw new Error("No existe una exportación visual asociada.");
                            renderizarImagen(visual, superficie);
                        } else {
                            await renderizarDrawio(recurso, superficie, token);
                        }
                    } else {
                        await renderizarCodigo(recurso, superficie, token);
                    }
                } catch (error) {
                    console.error(error);
                    if (token !== tokenRender) return;
                    superficie.innerHTML = `
                        <div class="estado-recurso">
                            <strong>No fue posible mostrar este archivo.</strong>
                            <span>${escaparHtml(recurso.relativa || recurso.nombre)}</span>
                        </div>
                    `;
                }
            }

            async function renderizarPresentacion(recurso, superficie, token) {
                const modulo = await import(new URL("../js/visor-pptx.js", document.baseURI).href);
                if (token !== tokenRender || !superficie.isConnected) return;
                await modulo.montarVisorPptx({
                    ruta: recurso.ruta,
                    nombre: recurso.nombre,
                    contenedor: superficie,
                    vigente: () => token === tokenRender
                });
            }

            function renderizarIframe(recurso, superficie) {
                superficie.classList.add("iframe");
                superficie.innerHTML = `<iframe src="${recurso.ruta}" class="frame" title="${escaparHtml(recurso.nombre)}"></iframe>`;
            }

            function renderizarImagen(recurso, superficie) {
                superficie.innerHTML = "";

                const visor = document.createElement("div");
                visor.className = "imagen-visor";
                visor.tabIndex = 0;
                visor.setAttribute(
                    "aria-label",
                    `Visor ampliable de ${recurso.nombre}`
                );

                const controles = document.createElement("div");
                controles.className = "imagen-controles";
                controles.setAttribute("role", "group");
                controles.setAttribute("aria-label", "Controles de la imagen");
                controles.innerHTML = `
                    <button type="button" data-imagen-zoom="menos" title="Alejar" aria-label="Alejar">−</button>
                    <button type="button" data-imagen-zoom="mas" title="Acercar" aria-label="Acercar">+</button>
                    <button type="button" data-imagen-ajustar>Ajustar</button>
                    <button type="button" data-imagen-pantalla title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
                `;

                const escenario = document.createElement("div");
                escenario.className = "imagen-escenario";

                const imagen = document.createElement("img");
                imagen.className = "imagen-zoomable";
                imagen.src = recurso.ruta;
                imagen.alt = recurso.nombre;
                imagen.draggable = false;

                escenario.appendChild(imagen);
                visor.append(controles, escenario);
                superficie.appendChild(visor);

                const iniciar = () => {
                    if (!visor.isConnected) return;
                    configurarVisorImagen(visor, escenario, imagen);
                };

                if (imagen.complete && imagen.naturalWidth > 0) iniciar();
                else imagen.addEventListener("load", iniciar, { once: true });
            }

            function configurarVisorImagen(visor, escenario, imagen) {
                const estado = {
                    escala: 1,
                    x: 0,
                    y: 0,
                    arrastrando: false,
                    puntero: null,
                    punteros: new Map(),
                    gestoPinza: null,
                    inicioX: 0,
                    inicioY: 0,
                    baseX: 0,
                    baseY: 0,
                    autoAjuste: true,
                    pantallaPendiente: false,
                    ajusteProgramado: null
                };

                const anchoNatural = Math.max(1, imagen.naturalWidth || 1);
                const altoNatural = Math.max(1, imagen.naturalHeight || 1);

                const aplicar = () => {
                    imagen.style.width = `${Math.max(1, anchoNatural * estado.escala)}px`;
                    imagen.style.height = "auto";
                    imagen.style.left = `calc(50% + ${estado.x}px)`;
                    imagen.style.top = `calc(50% + ${estado.y}px)`;
                };

                const calcularAjuste = () => {
                    const margen = 40;
                    const disponibleX = Math.max(1, escenario.clientWidth - margen);
                    const disponibleY = Math.max(1, escenario.clientHeight - margen);
                    return Math.min(
                        disponibleX / anchoNatural,
                        disponibleY / altoNatural,
                        1
                    );
                };

                const limitarEscala = (escala) => {
                    const minimo = Math.max(0.03, calcularAjuste() * 0.45);
                    return Math.min(6, Math.max(minimo, escala));
                };

                const ajustar = () => {
                    if (!visor.isConnected) return;
                    estado.escala = Math.max(0.03, calcularAjuste());
                    estado.x = 0;
                    estado.y = 0;
                    estado.autoAjuste = true;
                    estado.gestoPinza = null;
                    aplicar();
                };

                const programarAjuste = () => {
                    if (estado.ajusteProgramado) {
                        cancelAnimationFrame(estado.ajusteProgramado);
                    }
                    estado.ajusteProgramado = requestAnimationFrame(() => {
                        estado.ajusteProgramado = requestAnimationFrame(() => {
                            estado.ajusteProgramado = null;
                            ajustar();
                        });
                    });
                };

                const cambiarZoom = (direccion) => {
                    const factor = direccion > 0 ? 1.22 : 1 / 1.22;
                    const nueva = limitarEscala(estado.escala * factor);
                    if (Math.abs(nueva - estado.escala) < 0.0001) return;
                    estado.escala = nueva;
                    estado.autoAjuste = false;
                    aplicar();
                };

                const obtenerDosPunteros = () =>
                    Array.from(estado.punteros.values()).slice(0, 2);

                const medirPinza = () => {
                    const [a, b] = obtenerDosPunteros();
                    if (!a || !b) return null;
                    return {
                        distancia: Math.max(1, Math.hypot(b.x - a.x, b.y - a.y)),
                        centroX: (a.x + b.x) / 2,
                        centroY: (a.y + b.y) / 2
                    };
                };

                const iniciarPinza = () => {
                    const medida = medirPinza();
                    if (!medida) return;

                    const rect = escenario.getBoundingClientRect();
                    const centroLocalX = medida.centroX - rect.left;
                    const centroLocalY = medida.centroY - rect.top;

                    estado.gestoPinza = {
                        distancia: medida.distancia,
                        escala: estado.escala,
                        centroX: centroLocalX,
                        centroY: centroLocalY,
                        imagenX: escenario.clientWidth / 2 + estado.x,
                        imagenY: escenario.clientHeight / 2 + estado.y
                    };
                    estado.arrastrando = false;
                    estado.puntero = null;
                    estado.autoAjuste = false;
                    escenario.classList.remove("arrastrando");
                };

                const actualizarPinza = () => {
                    const medida = medirPinza();
                    const base = estado.gestoPinza;
                    if (!medida || !base) return;

                    const rect = escenario.getBoundingClientRect();
                    const centroX = medida.centroX - rect.left;
                    const centroY = medida.centroY - rect.top;
                    const nuevaEscala = limitarEscala(
                        base.escala * (medida.distancia / base.distancia)
                    );
                    const relacion = nuevaEscala / base.escala;

                    const imagenX =
                        centroX - (base.centroX - base.imagenX) * relacion;
                    const imagenY =
                        centroY - (base.centroY - base.imagenY) * relacion;

                    estado.escala = nuevaEscala;
                    estado.x = imagenX - escenario.clientWidth / 2;
                    estado.y = imagenY - escenario.clientHeight / 2;
                    estado.autoAjuste = false;
                    aplicar();
                };

                const iniciarArrastreCon = (puntero) => {
                    if (!puntero) return;
                    estado.arrastrando = true;
                    estado.puntero = puntero.id;
                    estado.inicioX = puntero.x;
                    estado.inicioY = puntero.y;
                    estado.baseX = estado.x;
                    estado.baseY = estado.y;
                    estado.autoAjuste = false;
                    escenario.classList.add("arrastrando");
                };

                visor
                    .querySelector('[data-imagen-zoom="menos"]')
                    ?.addEventListener("click", () => cambiarZoom(-1));
                visor
                    .querySelector('[data-imagen-zoom="mas"]')
                    ?.addEventListener("click", () => cambiarZoom(1));
                visor
                    .querySelector("[data-imagen-ajustar]")
                    ?.addEventListener("click", programarAjuste);

                const botonPantalla = visor.querySelector("[data-imagen-pantalla]");

                botonPantalla?.addEventListener("click", async () => {
                    if (estado.pantallaPendiente) return;
                    estado.pantallaPendiente = true;
                    botonPantalla.disabled = true;

                    try {
                        if (document.fullscreenElement === visor) {
                            await document.exitFullscreen();
                        } else if (typeof visor.requestFullscreen === "function") {
                            await visor.requestFullscreen();
                        } else {
                            visor.classList.toggle("fullscreen-fallback");
                            programarAjuste();
                        }
                    } catch (error) {
                        console.warn(
                            "PW Hub: no fue posible cambiar el modo de pantalla completa de la imagen.",
                            error
                        );
                    } finally {
                        estado.pantallaPendiente = false;
                        botonPantalla.disabled = false;
                    }
                });

                escenario.addEventListener("pointerdown", (evento) => {
                    if (evento.pointerType !== "touch" && evento.button !== 0) return;

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });
                    escenario.setPointerCapture?.(evento.pointerId);

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                    } else {
                        iniciarArrastreCon(estado.punteros.get(evento.pointerId));
                    }

                    evento.preventDefault();
                });

                escenario.addEventListener("pointermove", (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    estado.punteros.set(evento.pointerId, {
                        id: evento.pointerId,
                        x: evento.clientX,
                        y: evento.clientY
                    });

                    if (estado.punteros.size >= 2) {
                        if (!estado.gestoPinza) iniciarPinza();
                        actualizarPinza();
                        evento.preventDefault();
                        return;
                    }

                    if (
                        estado.arrastrando &&
                        evento.pointerId === estado.puntero
                    ) {
                        estado.x = estado.baseX + (evento.clientX - estado.inicioX);
                        estado.y = estado.baseY + (evento.clientY - estado.inicioY);
                        aplicar();
                        evento.preventDefault();
                    }
                });

                const terminarPuntero = (evento) => {
                    if (!estado.punteros.has(evento.pointerId)) return;

                    estado.punteros.delete(evento.pointerId);
                    try {
                        escenario.releasePointerCapture?.(evento.pointerId);
                    } catch {
                        // El navegador puede liberar la captura automáticamente.
                    }

                    if (estado.punteros.size >= 2) {
                        iniciarPinza();
                        return;
                    }

                    estado.gestoPinza = null;

                    if (estado.punteros.size === 1) {
                        iniciarArrastreCon(Array.from(estado.punteros.values())[0]);
                        return;
                    }

                    estado.arrastrando = false;
                    estado.puntero = null;
                    escenario.classList.remove("arrastrando");
                };

                escenario.addEventListener("pointerup", terminarPuntero);
                escenario.addEventListener("pointercancel", terminarPuntero);

                visor.addEventListener(
                    "wheel",
                    (evento) => {
                        if (!evento.ctrlKey) return;
                        evento.preventDefault();
                        cambiarZoom(evento.deltaY < 0 ? 1 : -1);
                    },
                    { passive: false }
                );

                escenario.addEventListener("dblclick", (evento) => {
                    evento.preventDefault();
                    cambiarZoom(1);
                });

                let observador = null;

                const alCambiarPantalla = () => {
                    if (!visor.isConnected) {
                        document.removeEventListener(
                            "fullscreenchange",
                            alCambiarPantalla
                        );
                        observador?.disconnect();
                        return;
                    }

                    const activo =
                        document.fullscreenElement === visor ||
                        visor.classList.contains("fullscreen-fallback");

                    botonPantalla?.classList.toggle("activo", activo);
                    botonPantalla?.setAttribute(
                        "aria-label",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    botonPantalla?.setAttribute(
                        "title",
                        activo ? "Salir de pantalla completa" : "Pantalla completa"
                    );
                    programarAjuste();
                };

                document.addEventListener("fullscreenchange", alCambiarPantalla);

                if (typeof ResizeObserver === "function") {
                    observador = new ResizeObserver(() => {
                        if (!visor.isConnected) {
                            observador.disconnect();
                            return;
                        }
                        if (
                            !estado.arrastrando &&
                            !estado.gestoPinza &&
                            estado.autoAjuste
                        ) {
                            programarAjuste();
                        }
                    });
                    observador.observe(escenario);
                }

                programarAjuste();
            }

            async function renderizarMarkdown(recurso, superficie, token) {
                const fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender) return;
                superficie.innerHTML = `
                    <article class="markdown">
                        ${window.marked ? marked.parse(fuente) : `<pre>${escaparHtml(fuente)}</pre>`}
                    </article>
                `;
                corregirRutasMarkdown(superficie, recurso.ruta);
            }

            async function renderizarCodigo(recurso, superficie, token) {
                let fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender) return;

                if (recurso.tipo === "json") {
                    try { fuente = JSON.stringify(JSON.parse(fuente), null, 2); } catch { /* original */ }
                }

                const pre = document.createElement("pre");
                pre.className = "codigo";
                pre.textContent = fuente;
                superficie.innerHTML = "";
                superficie.appendChild(pre);
            }

            async function renderizarEjecutorJS(recurso, superficie, token) {
                const url = new URL(recurso.ruta, window.location.href);
                // En Pages la ruta lleva /<alumno>/U4/; en localhost, /U4/.
                // Siempre exigimos mismo origen y archivo dentro de U4.
                let rutaLegible = url.pathname;
                try { rutaLegible = decodeURIComponent(url.pathname); } catch { /* conserva URL */ }
                const rutaU4 = /^\/(?:.*\/)?U4\/(?:[^/]+\/)*[^/]+\.js$/i.test(rutaLegible);
                if (url.origin !== window.location.origin || !rutaU4) {
                    throw new Error("El laboratorio solo abre JavaScript de U4 del propio portafolio.");
                }

                const fuente = await cargarFuente(recurso.ruta);
                if (token !== tokenRender || !superficie.isConnected) return;

                superficie.innerHTML = `
                    <div class="js-laboratorio">
                        <header class="js-lab-cabecera">
                            <div class="js-lab-titulo">
                                <span>LABORATORIO JS · UNIDAD 4</span>
                                <strong>Editor y consola</strong>
                                <small>Edita y ejecuta sin modificar el archivo original del repositorio.</small>
                            </div>
                            <div class="js-acciones">
                                <button type="button" data-js-ejecutar title="Ctrl + Enter">▶ Ejecutar</button>
                                <button type="button" data-js-detener disabled>■ Detener</button>
                                <button type="button" data-js-restaurar>Restaurar código</button>
                            </div>
                        </header>
                        <div class="js-lab-columnas">
                            <section class="js-lab-panel js-lab-panel-editor" aria-label="Editor JavaScript">
                                <div class="js-lab-panel-titulo">
                                    <span>editor.js <em data-js-modificado></em></span>
                                    <small data-js-lineas></small>
                                </div>
                                <div class="js-editor-cuerpo">
                                    <pre data-js-numeros aria-hidden="true"></pre>
                                    <textarea data-js-editor aria-label="Código JavaScript editable"
                                        spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
                                        wrap="off"></textarea>
                                </div>
                            </section>
                            <section class="js-lab-panel js-lab-panel-consola" aria-label="Consola JavaScript">
                                <div class="js-lab-panel-titulo">
                                    <span>Consola <small data-js-total>0 registros</small></span>
                                    <button type="button" data-js-limpiar>Limpiar</button>
                                </div>
                                <div data-js-salida class="js-salida" role="log" aria-label="Salida de JavaScript"
                                    aria-live="off"><p class="js-consola-vacia">Lista para ejecutar. Presiona ▶ Ejecutar o Ctrl + Enter.</p></div>
                                <div class="js-prompt-puerto" data-js-prompt-puerto aria-live="polite"></div>
                            </section>
                        </div>
                        <p class="js-nota">El código se ejecuta en un Worker dentro de un iframe aislado. No tiene acceso al DOM del Hub, a la red ni a Node.js. Cada prompt() pide su valor durante la ejecución. Límite: 6 s de cómputo entre entradas.</p>
                    </div>
                `;

                const entorno = superficie.querySelector(".js-laboratorio");
                const ejecutar = entorno.querySelector("[data-js-ejecutar]");
                const detener = entorno.querySelector("[data-js-detener]");
                const restaurar = entorno.querySelector("[data-js-restaurar]");
                const limpiar = entorno.querySelector("[data-js-limpiar]");
                const editor = entorno.querySelector("[data-js-editor]");
                const numeros = entorno.querySelector("[data-js-numeros]");
                const totalLineas = entorno.querySelector("[data-js-lineas]");
                const modificado = entorno.querySelector("[data-js-modificado]");
                const salida = entorno.querySelector("[data-js-salida]");
                const puertoPrompt = entorno.querySelector("[data-js-prompt-puerto]");
                editor.value = fuente;

                const actualizarGutter = () => {
                    const cantidad = editor.value.split("\n").length;
                    numeros.textContent = Array.from({ length: cantidad }, (_, indice) => indice + 1).join("\n");
                    totalLineas.textContent = `${cantidad} líneas`;
                    modificado.textContent = editor.value === fuente ? "" : "• modificado";
                };
                editor.addEventListener("input", actualizarGutter);
                editor.addEventListener("scroll", () => { numeros.scrollTop = editor.scrollTop; });
                editor.addEventListener("keydown", (evento) => {
                    if ((evento.ctrlKey || evento.metaKey) && evento.key === "Enter") {
                        evento.preventDefault();
                        ejecutar.click();
                    } else if (evento.key === "Tab") {
                        evento.preventDefault();
                        const ini = editor.selectionStart;
                        const fin = editor.selectionEnd;
                        editor.setRangeText("    ", ini, fin, "end");
                        actualizarGutter();
                    }
                });
                actualizarGutter();

                const totalRegistros = entorno.querySelector("[data-js-total]");
                let lineas = 0;
                let ejecuciones = 0;
                let bloqueActual = null;
                let cabeceraActual = null;
                let estadoActual = null;
                let inicioActual = 0;
                let bloqueAvisoLimite = false;
                const horaActual = () => new Intl.DateTimeFormat("es-MX", {
                    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
                }).format(new Date());
                const mostrarTotal = () => {
                    totalRegistros.textContent = `${lineas} ${lineas === 1 ? "registro" : "registros"}`;
                };
                const iniciarBloque = () => {
                    salida.querySelector(".js-consola-vacia")?.remove();
                    ejecuciones += 1;
                    inicioActual = performance.now();
                    const seccion = document.createElement("section");
                    seccion.className = "js-ejecucion";
                    cabeceraActual = document.createElement("header");
                    cabeceraActual.className = "js-ejecucion-cabecera";
                    const nombre = document.createElement("span");
                    nombre.textContent = `▶ Ejecución ${ejecuciones} · ${horaActual()}`;
                    estadoActual = document.createElement("span");
                    estadoActual.className = "js-ejecucion-estado";
                    estadoActual.textContent = "En curso";
                    cabeceraActual.append(nombre, estadoActual);
                    bloqueActual = document.createElement("div");
                    bloqueActual.className = "js-ejecucion-entradas";
                    seccion.append(cabeceraActual, bloqueActual);
                    salida.appendChild(seccion);
                    salida.scrollTop = salida.scrollHeight;
                };
                const finalizarBloque = (estado) => {
                    if (!estadoActual) return;
                    const segundos = ((performance.now() - inicioActual) / 1000).toFixed(2);
                    estadoActual.textContent = `${estado} · ${segundos} s`;
                };
                const registrar = (texto, clase = "") => {
                    if (!salida.isConnected) return;
                    if (!bloqueActual) iniciarBloque();
                    if (lineas >= 400) {
                        if (!bloqueAvisoLimite) {
                            bloqueAvisoLimite = true;
                            const aviso = document.createElement("p");
                            aviso.className = "js-consola-vacia";
                            aviso.textContent = "Límite de 400 registros. Pulsa Limpiar para reiniciar la consola.";
                            bloqueActual.appendChild(aviso);
                        }
                        return;
                    }
                    const fila = document.createElement("div");
                    fila.className = `js-log-fila ${clase}`.trim();
                    const chevron = document.createElement("span");
                    chevron.className = "js-log-chevron";
                    chevron.setAttribute("aria-hidden", "true");
                    chevron.textContent = "›";
                    const contenido = document.createElement("div");
                    contenido.className = "js-log-texto";
                    contenido.textContent = String(texto).slice(0, 3000);
                    const hora = document.createElement("time");
                    hora.className = "js-log-hora";
                    hora.dateTime = new Date().toISOString();
                    hora.textContent = horaActual();
                    fila.append(chevron, contenido, hora);
                    bloqueActual.appendChild(fila);
                    lineas++;
                    mostrarTotal();
                    salida.scrollTop = salida.scrollHeight;
                };
                const solicitarRespuesta = (sesion, mensaje) => {
                    // Cada prompt se presenta cuando el codigo llega a esa linea.
                    // No se precargan valores ni se usa el dialogo bloqueante del navegador.
                    if (ejecucionJSActiva !== sesion) return;
                    window.clearTimeout(sesion.timeout);
                    sesion.timeout = null;
                    estadoActual.textContent = "Esperando respuesta";
                    if (sesion.formulario) sesion.formulario.remove();

                    const form = document.createElement("form");
                    form.className = "js-prompt-form";
                    form.setAttribute("aria-label", "Entrada solicitada por el programa");
                    const pregunta = document.createElement("label");
                    const id = `js-pregunta-${Math.random().toString(36).slice(2)}`;
                    pregunta.htmlFor = id;
                    pregunta.textContent = String(mensaje.pregunta || "Introduce un valor:").slice(0, 450);
                    const controles = document.createElement("div");
                    controles.className = "js-prompt-controles";
                    const campo = document.createElement("input");
                    campo.id = id;
                    campo.type = "text";
                    campo.autocomplete = "off";
                    campo.spellcheck = false;
                    campo.placeholder = "Escribe tu respuesta aquí";
                    campo.value = String(mensaje.predeterminado ?? "");
                    campo.required = false; // prompt() acepta tambien cadena vacia.
                    const enviar = document.createElement("button");
                    enviar.type = "submit";
                    enviar.textContent = "Enviar ↵";
                    const cancelar = document.createElement("button");
                    cancelar.type = "button";
                    cancelar.textContent = "Cancelar";
                    controles.append(campo, enviar, cancelar);
                    form.append(pregunta, controles);
                    puertoPrompt.appendChild(form);
                    entorno.classList.add("js-esperando-prompt");
                    sesion.formulario = form;
                    salida.scrollTop = salida.scrollHeight;
                    campo.focus({ preventScroll: true });

                    let respondida = false;
                    const responder = (valor) => {
                        if (respondida || ejecucionJSActiva !== sesion) return;
                        respondida = true;
                        form.remove();
                        entorno.classList.remove("js-esperando-prompt");
                        sesion.formulario = null;
                        registrar(`prompt(${pregunta.textContent}) → ${valor === null ? "Cancelar (null)" : valor}`, "js-aviso");
                        estadoActual.textContent = "En curso";
                        sesion.frame.contentWindow?.postMessage({
                            id: "pwhub-ejecucion-u4", tipo: "respuesta",
                            promptId: mensaje.promptId, valor
                        }, "*");
                        // El limite protege al Worker solo mientras ejecuta, no mientras se escribe.
                        sesion.timeout = window.setTimeout(() => {
                            if (ejecucionJSActiva !== sesion) return;
                            terminar();
                            registrar("Se alcanzó el límite de 6 segundos de ejecución.", "js-error");
                            finalizarBloque("Tiempo agotado");
                        }, 6000);
                    };
                    form.addEventListener("submit", (evento) => {
                        evento.preventDefault();
                        responder(campo.value);
                    });
                    // Cancelar termina la ejecución completa, no devuelve null al
                    // script. En ejercicios que reintentan un dato inválido, enviar
                    // null reiniciaba el mismo prompt indefinidamente.
                    cancelar.addEventListener("click", () => {
                        if (respondida || ejecucionJSActiva !== sesion) return;
                        respondida = true;
                        registrar(`Entrada cancelada: ${pregunta.textContent}`, "js-aviso");
                        terminar();
                        registrar("■ Ejecución cancelada por el usuario.", "js-aviso");
                        finalizarBloque("Cancelada");
                    });
                };
                const terminar = () => {
                    if (ejecucionJSActiva?.superficie === superficie) {
                        ejecucionJSActiva.formulario?.remove();
                        entorno.classList.remove("js-esperando-prompt");
