<!DOCTYPE html>
<html>
    <!-- Esto es un ejemplo de uso de Flexbox -->
    <head>
        <meta charset="UTF-8">
        <title> Ejemplo Flex </title>
        <style>
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: cadetblue;
                padding: 15px 25px;
            }

            .menu {
                display: flex;
                gap: 20px;
                align-items: center;
            }

            .menu a {
                color: black;
                text-decoration: none;
            }

            .menu a:hover {
                color: white;
            }
        </style>
    </head>

    <!-- Cuerpo del documento -->
    <body>
        <nav class="navbar">
            <h2 style="color: red; background-color: black;"> Mi Página </h2>

            <div class="menu"> 
                <a href="#">Inicio</a>
                <a href="#">Productos</a>
                <a href="#">Contacto</a>
            </div>
        </nav>
    </body>
</html>
