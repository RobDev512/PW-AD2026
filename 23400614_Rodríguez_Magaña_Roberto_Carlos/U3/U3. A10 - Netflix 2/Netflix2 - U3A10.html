<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Netflix2</title>
        <link rel="stylesheet" href="./css/styles.css">
        <link rel="icon" type="image/png" href="./img/netflix-logo2.png">
    </head>
    <body>
        <header>
          <div class="cataloge-container">
            <nav class="navbar">
              <a href="#"><img src="./img/netflix-logo.png" class="logo" alt="Netflix"></a>

              <div class="nav-right">
                <a href="#"> Inicio </a>
                <a href="#"> Películas </a>
                <a href="#"> Mi lista </a>
              </div>
            </nav>

            <hr>

            <div class="subtitulos">
              <h2> Catálogo de películas </h2>
              <p> Descubre tu próxima película favorita. </p>
            </div>

            <div class="categorias">
              <button class="categoria-activa"> Todas </button>
              <button> Acción </button>
              <button> Comedia </button>
              <button> Drama </button>
              <button> Ciencia ficción </button>
            </div>

            <div class="peliculas-grid">
              <div class="pelicula">
                <img src="./img/Pelicula1.png" class="poster" alt="Dune: Parte Dos">
                <h3> Dune: Parte Dos </h3>
                <p> 2024 • Ciencia ficción </p>
              </div>

              <div class="pelicula">
                <img src="./img/Pelicula2.png" class="poster" alt="Gladiador">
                <h3> Gladiador </h3>
                <p> 2000 • Acción </p>
              </div>

              <div class="pelicula">
                <img src="./img/Pelicula3.png" class="poster" alt="La La Land">
                <h3> La La Land </h3>
                <p> 2016 • Drama </p>
              </div>

              <div class="pelicula">
                <img src="./img/Pelicula4.png" class="poster" alt="Superbad">
                <h3> Superbad </h3>
                <p> 2007 • Comedia </p>
              </div>

              <div class="pelicula">
                <img src="./img/Pelicula5.png" class="poster" alt="El planeta de los simios: Nuevo reino">
                <h3> El planeta de los simios: Nuevo reino </h3>
                <p> 2024 • Ciencia ficción </p>
              </div>

              <div class="pelicula">
                <img src="./img/Pelicula6.png" class="poster" alt="John Wick">
                <h3> John Wick </h3>
                <p> 2014 • Acción </p>
              </div>
            </div>
          </div>
        </header>
    </body>
</html>
