<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Netflix</title>
        <link rel="stylesheet" href="./css/styles.css">
    </head>
    <body>
        <header class="hero">

            <div class="hero-bg"></div>

            <nav class="navbar">
                <img src="./img/netflix-logo.png" class="logo" alt="Netflix">

                <div class="nav-right">
                    <select class="language-selector">
                        <option>Español</option>
                        <option>Ingles</option>
                        <option>Francés</option>
                    </select>

                    <button class="signin-btn">Iniciar sesión</button>
                </div>
            </nav>

            <div class="hero-content">
                <h1>Películas y series<br>ilimitadas y mucho más</h1>

                <p><strong>A partir de $139. Cancela cuando quieras.</strong></p>

                <p>
                    ¿Quieres ver Netflix ya? Ingresa tu email
                    para crear una cuenta o reiniciar tu membresía.
                </p>

                <div class="email-signup">
                    <input type="email" placeholder="Email">
                    <button class="get-started-btn">Comenzar &gt;</button>
                </div>
            </div>

        </header>

    </body>
</html>
