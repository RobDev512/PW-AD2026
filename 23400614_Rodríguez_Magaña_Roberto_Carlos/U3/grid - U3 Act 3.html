<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> Ejemplo Grid </title>
        <style>
            .contenedor {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .caja {
                background-color: blueviolet;
                color: white;
                padding: 30px;
                text-align: center;
                font-size: 24px;
                border-radius: 8px;
            }
        </style>

    </head>

    <body>
        <h1> Ejemplo Grid </h1>

        <div class="contenedor">
            <div class="caja"> 1 </div>
            <div class="caja"> 2 </div>
            <div class="caja"> 3 </div>
            <div class="caja"> 4 </div>
            <div class="caja"> 5 </div>
            <div class="caja"> 6 </div>
        </div>
    </body>
</html>
