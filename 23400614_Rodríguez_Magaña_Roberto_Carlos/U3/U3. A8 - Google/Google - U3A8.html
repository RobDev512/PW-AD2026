<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Google</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <header>
    <nav class="nav-top">
      <ul>
        <li><a href="#" class="GmaileImagenes">Gmail</a></li>
        <li><a href="#" class="GmaileImagenes">Imágenes</a></li>
        <li><a href="#" class="btn-login">Acceder</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    <h1 id="google-logo" aria-label="Google">
      <span class="g">G</span>
      <span class="o1">o</span>
      <span class="o2">o</span>
      <span class="g2">g</span>
      <span class="l">l</span>
      <span class="e">e</span>
    </h1>
    <div class="search-container">
      <textarea class="search-input" rows="1" placeholder="Ingresa una busqueda..."></textarea>
    </div>
    <div class="buttons">
      <button class="btn-search">Buscar con Google</button>
      <button class="btn-lucky">Voy a tener suerte</button>
    </div>
  </main>
  <footer>
    <p class="country">México</p>
    <div class="footer-links">
      <ul class="left-links">
        <li><a href="#">Sobre Google</a></li>
        <li><a href="#">Publicidad</a></li>
        <li><a href="#">Negocios</a></li>
        <li><a href="#">Cómo funciona la Búsqueda</a></li>
      </ul>
      <ul class="right-links">
        <li><a href="#">Privacidad</a></li>
        <li><a href="#">Condiciones</a></li>
        <li><a href="#">Configuración</a></li>
      </ul>
    </div>
  </footer>

</body>

</html>
